engineStrict: true

overrides:
  # 钉死 0.5.3，勿放开成 ^：0.5.4 的具名布局插槽在客户端导航时会整个丢掉。
  # 它把注册插槽改成了 `slots.value ??= (onScopeDispose(() => slots.value = null), value)`，
  # 而路由切换时 Vue 先跑新页面的 setup、后卸载旧页面：轮到新页面注册时 slots.value
  # 还是旧页面的，??= 短路，连带右侧的 onScopeDispose 也没登记上；随后旧页面卸载，
  # 它自己那个 disposer 把 slots.value 清成 null —— 侧栏（文章目录等）就此空掉。
  # 直接打开或刷新则没有「旧页面」，slots.value 是 null，赋值照常，故只在点进去时复现。
  '@dxup/nuxt': 0.5.3
  # 修复花括号展开可撑爆内存（CVE-2026-13149 / GHSA #105），抬到已修复版。
  # 公告的影响范围是 <= 5.0.7，没有下限，minimatch 5/9 拖着的那份 2.x 也在其中，
  # 而修复只出在 5.0.8，故只能跨大版本压上去。这个包的 API 只有一个 expand()，
  # major 抬的是 node engine，压得动。
  brace-expansion: '>=5.0.8'
  # 修复 esbuild dev server 路径穿越（GHSA-g7r4-m6w7-qqqr，仅 Windows），抬到已修复版
  esbuild: '>=0.28.1'
  nuxtseo-layer-devtools: link:__unneeded__
  # 修复 libvips 一系列图像解析漏洞（GHSA-f88m-g3jw-g9cj），抬到已修复版。
  # ipx 和 nuxt-og-image 的范围卡在 ^0.34，靠它们自己升不动；而 0.35 本来就在树里
  # （nuxt-seo-utils 带的），统一到一个版本顺带也省一份二进制。
  sharp: '>=0.35.0'

patchedDependencies:
  # LayoutSlot 客户端水合首帧也等待页面注册插槽内容（上游只在服务端等），
  # 否则侧栏先渲染成空占位，与 SSR 输出不一致，每页一条 hydration mismatch
  '@dxup/nuxt@0.5.3': patches/@dxup__nuxt@0.5.3.patch
  # 图片支持配置 1.5x 像素密度
  '@nuxt/image': patches/@nuxt__image.patch
  # remark ts 插件使用 unrun 运行
  # 代码块不将 tab 转为空格
  # 行内代码 props.code 传入原文
  '@nuxtjs/mdc': patches/@nuxtjs__mdc.patch
  # adoptedStyleSheet ::highlight 高亮选择器
  plain-shiki: patches/plain-shiki.patch

shamefullyHoist: true
catalog:
  marked: ^18.0.7
