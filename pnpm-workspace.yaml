allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  oxc-resolver: true
  rolldown: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

catalogs:
  content:
    '@bikariya/shiki': ^0.0.8
    '@nuxt/content': ^3.16.0
    '@nuxtjs/i18n': ^10.6.0
    '@nuxtjs/seo': ^5.3.14
    '@shikijs/colorized-brackets': ^4.4.3
    '@shikijs/transformers': ^4.4.3
    '@types/hast': ^3.0.5
    '@types/mdast': ^4.0.4
    abcjs: ^6.7.0
    mermaid: ^11.17.2
    minimark: 0.2.0
    nuxt-llms: ^0.2.0
    plain-shiki: ^0.3.2
    rehype-katex: ^7.0.1
    remark-math: ^6.0.0
    remark-reading-time: ^2.1.0
    shiki: ^4.4.3
    unist-util-visit: ^5.1.0
    vfile: ^6.0.3
    zod: ^4.5.4
  framework:
    '@zinkawaii/tsconfig': ^0.1.0
    ci-info: ^4.4.0
    nuxt: ^4.5.2
    pinia: ^4.0.3
    sass-embedded: ^1.104.0
    typescript: ^6.0.3
    unrun: ^0.3.1
    unplugin-yaml: ^4.2.1
    vue: ^3.5.42
    vue-router: ^5.3.1
  quality:
    '@antfu/eslint-config': ^9.5.1
    '@nuxt/a11y': 1.0.0-alpha.1
    '@nuxt/hints': ^1.1.4
    # 不跟上游的 ^0.5.2：它把 stylelint-config-standard-scss 换成了 stylelint-config-standard，
    # 丢掉 postcss-scss 语法，.scss 被当纯 CSS 解析（@mixin 未知、// 注释 CssSyntaxError）。
    # 上游正在迁往纯 CSS，本站仍全站 SCSS，迁完之前留在 0.4.x。
    '@zinkawaii/stylelint-config': ^0.4.1
    cspell: ^10.2.2
    eslint: ^10.10.0
    stylelint: ^17.15.0
  ui:
    '@bikariya/image-viewer': ^0.0.8
    '@bikariya/modals': ^0.0.8
    '@iconify-json/catppuccin': ^1.2.17
    '@iconify-json/line-md': ^1.2.16
    '@iconify-json/ri': ^1.2.10
    '@iconify-json/simple-icons': ^1.2.94
    '@iconify-json/tabler': ^1.2.38
    '@nuxt/icon': ^2.5.1
    '@nuxt/image': ^2.1.0
    '@nuxtjs/color-mode': ^4.0.1
    embla-carousel-autoplay: ^8.6.0
    embla-carousel-vue: ^8.6.0
    embla-carousel-wheel-gestures: ^8.1.0
    maplibre-gl: ^5.24.0
    vue-tippy: ^6.7.1
  util:
    '@clack/prompts': ^1.7.0
    '@pinia/nuxt': ^1.0.2
    '@vueuse/core': ^14.4.0
    '@vueuse/nuxt': ^14.4.0
    '@vueuse/router': ^14.4.0
    es-toolkit: ^1.52.0
    fast-xml-builder: ^1.3.1
    minisearch: ^7.2.0
    oxc-minify: ^0.148.0
    p-limit: ^7.3.2
    parse-domain: ^8.4.0
    rimraf: ^6.1.3
    site-config-stack: ^4.2.3
    strip-ansi: ^7.2.0
    temporal-polyfill: ^1.0.4
    yaml: ^2.9.0

engineStrict: true

overrides:
  # 修复花括号展开可撑爆内存（CVE-2026-13149 / GHSA #105），抬到已修复版。
  # 公告的影响范围是 <= 5.0.7，没有下限，minimatch 5/9 拖着的那份 2.x 也在其中，
  # 而修复只出在 5.0.8，故只能跨大版本压上去。这个包的 API 只有一个 expand()，
  # major 抬的是 node engine，压得动。
  # 后续 GHSA-rgw5-rvv9-x895 又披露 >=4.0.0 <5.0.9 的正则回溯问题，floor 抬到 5.0.9。
  brace-expansion: '>=5.0.9'
  # 修复 esbuild dev server 路径穿越（GHSA-g7r4-m6w7-qqqr，仅 Windows），抬到已修复版
  esbuild: '>=0.28.1'
  # 修复 GHSA-2v37-7h3g-55p8，抬到已修复版。postcss 的 ^3.3.16 本来够得到，
  # 但 pnpm update 不动传递依赖，只能压。锁在 3.x：nanoid 5 起是 ESM-only，postcss 用不了
  nanoid: ^3.3.17
  # 修复 libvips 一系列图像解析漏洞（GHSA-f88m-g3jw-g9cj），抬到已修复版。
  # ipx 和 nuxt-og-image 的范围卡在 ^0.34，靠它们自己升不动；而 0.35 本来就在树里
  # （nuxt-seo-utils 带的），统一到一个版本顺带也省一份二进制。
  sharp: '>=0.35.0'

patchedDependencies:
  # 图片支持配置 1.5x 像素密度
  '@nuxt/image': patches/@nuxt__image.patch
  # 代码块不将 tab 转为空格
  # 行内代码 props.code 传入原文
  '@nuxtjs/mdc': patches/@nuxtjs__mdc.patch
  # IPX 的 Sharp 无法处理 ICO ，但改变运行时 NuxtImg provider 有类型问题 https://github.com/nuxt/image/issues/2174
  ipx: patches/ipx.patch
  # adoptedStyleSheet ::highlight 高亮选择器
  plain-shiki: patches/plain-shiki.patch

shamefullyHoist: true
catalog:
  marked: ^18.0.7
