slug: kansai-202504
title: Kansai
subtitle: '2025.4'
posttitle: 'Travel Journal: Kansai (April 2025)'
description: |-
  One weekend in April,
  a coworker said, “Let’s go to Japan.”
  So we went to Japan.
published: 2025-05-19
totaldays: 3
coverImage: https://blog-img.774352199.xyz/X1lM9m.webp
days:
  - day: 0
    title: A Sleepless Night at Pudong Airport
    descriptions:
      - 'We took the high-speed train to Shanghai Pudong Airport straight after work on Friday. Our flight was at six on Saturday morning. I had never caught such an early flight and had no idea what I was doing, so I booked a hotel miles from the airport. After working out the logistics, we thought, fine, we might as well spend the night at the airport.'
      - 'Had I known how miserable an overnight stay at Pudong would be, I would have chosen a few hours lying down in a hotel over sitting on a hard bench until dawn.'
      - 'I even brought two bottles of alcohol to help me “fall asleep quickly.” In the end they only made me sleepier, and the night that little bit harder to endure.'
    photos:
      - src: https://blog-img.774352199.xyz/YrOYzP.webp
        alt: 'Working hard, after hours'
        caption: 'Getting a seat in the check-in hall was hard enough, never mind one next to a power socket. Even the shuttered restaurants had people stretched out on the tables. S: even on a Friday, you have to put in the overtime!'
        lat: 31.1535527
        lng: 121.80436
      - src: https://blog-img.774352199.xyz/6p1Ygk.webp
        alt: 'You take my picture, I’ll take yours!'
        caption: 'K brought his full arsenal of lenses on holiday for the first time and shot everything in sight, looking thoroughly furtive about it.'
        lat: 31.1507027
        lng: 121.80728
      - src: https://blog-img.774352199.xyz/oBCAWM.webp
        alt: 'Overtime, with a brave little smile'
        caption: 'By now it was four in the morning. Checked in, through security, past customs. S could finally do overtime… undisturbed.'
        lat: 31.1506972
        lng: 121.8073194
      - src: https://blog-img.774352199.xyz/VWe7oM.webp
        alt: Peachy-Butt Airlines
        caption: 'Sunrise was getting closer, and our inbound aircraft had finally reached the airport.'
        lat: 31.15072
        lng: 121.80741
      - src: https://blog-img.774352199.xyz/Haz3sP.webp
        alt: The next morning’s sun
        caption: 'After circling the departure hall again and again, I suddenly noticed a crowd pressed up against the windows taking photos. Ah, of course: the sun was coming up.'
        lat: 31.150605
        lng: 121.807594
      - src: https://blog-img.774352199.xyz/egvYLZ.webp
        alt: An ugly little green plane
        caption: 'Tickets scanned, boarded, ready to go. Outside the window an ugly Russian jet was coming in to land.'
        lat: 31.15028
        lng: 121.808594
  - day: 1
    title: Above the Clouds
    descriptions:
      - 🛫 ——> 🛬
      - 'Attempt number two at sleeping: failed.'
      - 'I am a light sleeper to begin with. Between the roar of the engines and the vibrations, sleep was impossible, so I could only stare out the window. S and K slept soundly. Ah, to be young and fall asleep the moment your head drops.'
    photos:
      - src: https://blog-img.774352199.xyz/2s45dj.webp
        alt: And we’re off! 🛫
        caption: 'Overcast weather is my favourite kind for a takeoff, because it means the plane will climb through the cloud layer and out above the sea of clouds.'
        lat: 31.15092
        lng: 121.809425
      - src: https://blog-img.774352199.xyz/FByyUH.webp
        alt: Above the clouds, though not the Guizhou kind that hosts iCloud
        lat: 30.9678027
        lng: 122.13342
      - src: https://blog-img.774352199.xyz/PhKuO2.webp
        alt: 'Above the clouds, take two'
        lat: 30.9699416
        lng: 122.14048
      - src: https://blog-img.774352199.xyz/8wSA4R.webp
        alt: Little islands
        caption: The first little island after what felt like ages of flying with nothing to look at.
        lat: 32.8994638
        lng: 129.580627
      - src: https://blog-img.774352199.xyz/HAAY0y.webp
        alt: 'Shikoku, take one'
        caption: 'Land at last, and plenty of it: we were over Shikoku.'
        lat: 34.1282
        lng: 134.566483
      - src: https://blog-img.774352199.xyz/gRislE.webp
        alt: 'Shikoku, take two'
        caption: 'Japan really is not a flat country. Mile after mile of folded hills, with only a few stretches of connected plain. Japanese cities are fairly small, and a single small plain might hold three or four of them, which back home would be roughly one city and the counties under it.'
        lat: 34.2280305
        lng: 134.875275
      - src: https://blog-img.774352199.xyz/FXbyzk.webp
        alt: Landing at Kansai International Airport
        caption: Kansai International Airport sits on an artificial island in the Seto Inland Sea. The weather was mediocre and a little hazy. On a clear day you can see the water.
        lat: 34.43206
        lng: 135.24771
      - src: https://blog-img.774352199.xyz/axF4fX.webp
        alt: Haruka
        caption: 'Riding the familiar Hello Kitty Haruka, except this time we were headed for Kyoto.'
        lat: 34.392638
        lng: 135.3321027
  - day: 1
    title: I Was Awake. Probably.
    descriptions:
      - 'Thanks to Japan’s positively backward rule that hotels will not let you check in until 3 p.m., the three of us began wandering Kyoto.'
      - The mind had left the building. The body kept wandering.
    photos:
      - src: https://blog-img.774352199.xyz/LaNbtP.webp
        alt: A very improvised lunch
        caption: 'All three of us are the type who never plan, so a restaurant reservation was out of the question. We picked somewhere in the basement of Kyoto Station with no queue. It turns out restaurants without queues have their reasons: a small, bloody, undercooked steak too tough to chew, and outrageously expensive too.'
        lat: 34.9867972
        lng: 135.7580361
      - src: https://blog-img.774352199.xyz/GlHSXJ.webp
        alt: A shrine in the city center
        caption: 'Our hotel was near Shijō in Kyoto, about the most modern part of the city. Even along a busy main road like that you still see any number of shrines, sitting beside the such-and-such Bank and such-and-such Building, making it feel as if different eras coexist.'
        lat: 35.00742
        lng: 135.7597194
      - src: https://blog-img.774352199.xyz/n9RrOE.webp
        alt: 'Inabadō (Byōdō-ji), the “cat shrine”'
        caption: 'We left our luggage at the hotel. S and K both have pets at home, so the first stop on the plan was Inabadō (Byōdō-ji), also known as the cat shrine. It actually enshrines Yakushi Nyorai, but it is famous for selling cat amulets, and people on Xiaohongshu have run into the tabby that lives there. Sadly we did not meet it, and only heard steady meowing from behind the statues. I bought a cat-shaped strap for a notebook, in the hope of one day finding a notebook I like enough to use it on.'
        lat: 34.9993416
        lng: 135.7602638
      - src: https://blog-img.774352199.xyz/KSjTQ6.webp
        alt: A tiny ⛩️ in the roadside grass
        lat: 34.9988805
        lng: 135.7680111
      - src: https://blog-img.774352199.xyz/z5nLnr.webp
        alt: Late cherry blossoms down a quiet alley
        caption: 'Lush green leaves, with only a few blossoms left.'
        lat: 34.9988694
        lng: 135.7682333
      - src: https://blog-img.774352199.xyz/iPS74e.webp
        alt: 'The Kamo River, take one'
        caption: 'The Kamo River has a kind of magic to it. Like the Songhua in Harbin, every aimless walk ends up here sooner or later.'
        lat: 34.9989
        lng: 135.7688
      - src: https://blog-img.774352199.xyz/N8ieWN.webp
        alt: 'The Kamo River, take two'
        caption: 'As I sat by the Kamo River staring at the far bank, it felt as though I had slipped through time. It is also possible I fell asleep and woke up again. A group who looked like university students were picnicking nearby, and a steady stream of people cycled or jogged past behind us. Everything was completely unhurried, except for S, who was still in a meeting on his phone.'
        lat: 34.999005
        lng: 135.7695305
      - src: https://blog-img.774352199.xyz/d8cp3H.webp
        alt: 'At last, sleep'
        caption: 'We finally made it to three in the afternoon and checked in. S lay down on the bed to play with his phone and fell asleep before the screen went dark, though that may have been the meetings.'
        lat: 35.007616
        lng: 135.7597361
      - src: https://blog-img.774352199.xyz/bBuDpy.webp
        alt: Skewers. So good.
        caption: 'Slept until it was dark, then went out to hunt for food and ended up at an izakaya. Japanese portions are always tiny: two people will sit over three or four skewers of yakitori and drink beer. The three of us started at several dozen skewers plus three cocktails, and K, who cannot really drink, went bright red on the spot.'
        lat: 35.0086
        lng: 135.7615305
  - day: 2
    title: 'Nara, City of 🦌: Kasuga Taisha and Tōdai-ji'
    descriptions:
      - 'For a fun, hands-on Kansai trip, Nara is an essential stop: a chance to get close to nature.'
      - 'The whole city is filled with a distinctive scent of nature: deer poop.'
      - 'Our strategy was maximum freeloading. Not a single packet of deer crackers: straight in for the petting.'
    photos:
      - src: https://blog-img.774352199.xyz/xvWtRr.webp
        alt: Outside Kintetsu Nara Station
        caption: 'It has earned its reputation as a world-famous tourist town. We had already seen Nara adverts plastered across every train and subway, and the crowds really are far heavier than in Kyoto or Osaka.'
        lat: 34.684327
        lng: 135.829225
      - src: https://blog-img.774352199.xyz/Alg5Te.webp
        alt: 'Nikon: for sharper bird shots'
        lat: 34.685
        lng: 135.83248
      - src: https://blog-img.774352199.xyz/4WifFm.webp
        alt: 'Roadside 🦌, take one'
        caption: 'Nara has these little 🦌 sitting tucked up by the roadside all over the place. Perhaps they were already full, because they were very docile and would not chase you for crackers when you came close. Having bought exactly zero crackers, I felt a bit guilty and only gave one a token pat on the head.'
        lat: 34.68365
        lng: 135.838438
      - src: https://blog-img.774352199.xyz/7X1dwM.webp
        alt: 'Roadside 🦌, take two'
        caption: 'K had no such qualms and went in for a proper vigorous rub. The 🦌 actually looked pleased about it. Ah. A masochist 🦌, then.'
        lat: 34.68365
        lng: 135.838438
      - src: https://blog-img.774352199.xyz/ux8RMP.webp
        alt: An influencer deer
        caption: 'At the entrance to Kasuga Taisha there is often a deer standing between two stone lanterns, with a crowd around it taking photos and feeding it. This one was working the pose and thoroughly enjoying itself.'
        lat: 34.681061
        lng: 135.8444638
      - src: https://blog-img.774352199.xyz/1UgEGE.webp
        alt: A bowing little 🦌
        caption: 'The little 🦌 inside the shrine are far better mannered than the ones in Nara Park. No chasing you down, biting your hem or headbutting your kidneys; they bow their heads and ask politely instead.'
        lat: 34.68092
        lng: 135.8459472
      - src: https://blog-img.774352199.xyz/VpuSwQ.webp
        alt: Abundant Ebon Deer
        caption: 'Holy crap, a die-hard Honkai: Star Rail fan!'
        lat: 34.6808805
        lng: 135.8466805
      - src: https://blog-img.774352199.xyz/18ZFvJ.webp
        alt: Good fortune!
        caption: 'I have been sore about the bad-luck fortune I drew at Kiyomizu-dera last time, so drawing a good one at Kasuga Taisha was a relief. Poor S drew a bad one.'
        lat: 34.681072
        lng: 135.8484194
      - src: https://blog-img.774352199.xyz/h6hz4h.webp
        alt: Another influencer deer
        caption: 'There is another little 🦌 that likes to pose by the exit of Kasuga Taisha as well, though compared with the entrance there was hardly anyone about.'
        lat: 34.6809694
        lng: 135.84764
      - src: https://blog-img.774352199.xyz/i66eZ6.webp
        alt: Tōdai-ji
        caption: 'This was not my first visit to Tōdai-ji, but I still found myself thinking the same thing: it really is enormous. You rarely see a temple on that scale back home.'
        lat: 34.6882361
        lng: 135.83935
      - src: https://blog-img.774352199.xyz/3HNlIx.webp
        alt: Kōmokuten
        caption: 'Kōmokuten inside Tōdai-ji, eyes blazing. Hold on, is Kōmokuten not the one with the lute? Or have I been playing too much Black Myth: Wukong? S drew another fortune here, bad again, at which point he donated every coin he had.'
        lat: 34.689083
        lng: 135.8396138
  - day: 2
    title: 'Mount Wakakusa: So Much Poop'
    descriptions:
      - 'Leave Tōdai-ji and head uphill to the southeast, and you will reach Mount Wakakusa.'
      - 'The Mount Wakakusa of Xiaohongshu fame is a very small area: just one west-facing slope. There was almost nowhere to sit because it was covered in deer poop. Everyone around us was speaking Chinese; we could have been back home.'
      - 'So we chose a less social-media-famous route: climb to the actual summit of Mount Wakakusa and look out over all of Nara.'
    photos:
      - src: https://blog-img.774352199.xyz/FM2yAW.jpg
        alt: A quiet path uphill
        caption: 'A quiet path uphill, with almost nobody on it.'
        lat: 34.6857083
        lng: 135.8504472
      - src: https://blog-img.774352199.xyz/OlFC10.jpg
        alt: A grass-eating 🦌
        caption: 'The 🦌 up here no longer chase you for crackers; they just keep their heads down and work through the grass. Honestly, if it were not for these, I would have half forgotten that deer are grazing animals rather than cracker-eating ones.'
        lat: 34.686175
        lng: 135.850314
      - src: https://blog-img.774352199.xyz/P9rOIJ.jpg
        alt: Halfway up
        caption: 'There is a small terrace halfway up, and here there were actually a few other visitors who looked like they meant to camp. Sun on the east side, rain on the west: worth the climb.'
        lat: 34.6883
        lng: 135.8513027
      - src: https://blog-img.774352199.xyz/1uYlTL.webp
        alt: Straight out of a romance drama
        lat: 34.68828
        lng: 135.8513
      - src: https://blog-img.774352199.xyz/5K50g0.jpg
        alt: Made it to the top!
        caption: 'We hauled ourselves to the summit at last, just as the sun was going down and being neatly covered by a bank of cloud. We waited a while hoping it would show itself again, but it set behind the clouds instead.'
        lat: 34.6900416
        lng: 135.853761
      - src: https://blog-img.774352199.xyz/UeUhOL.jpg
        alt: The photo of a lifetime
        caption: 'On the way down K used his longest lens to take a photo of S and me. Were it not for the internationally recognised hand gesture, it would qualify as a photo of a lifetime in every sense.'
        lat: 34.687957
        lng: 135.851129
      - src: https://blog-img.774352199.xyz/mpXAEK.jpg
        alt: A hillside full of 🦌
        caption: 'At the foot of Mount Wakakusa, with the light already going. The 🦌 covering the slope had stopped chasing each other and were quietly grazing.'
        lat: 34.685311
        lng: 135.847342
      - src: https://blog-img.774352199.xyz/ZTYoPO.webp
        alt: Rice doesn’t come cheap in Nara
        caption: 'Japanese rice prices had already made the news for soaring before we came. A 1.5 kg bag in a convenience store was 1,920 yen, over thirty yuan per 500 g. Eye-watering.'
        lat: 34.684598
        lng: 135.828862
  - day: 3
    title: Time to Go Home
    descriptions:
      - 'We had no particular plans for the last day, so we declared it shopping day.'
      - 'Good times always fly by. As if reluctant to let us leave, our flight made a special effort to be four hours late.'
    photos:
      - src: https://blog-img.774352199.xyz/PUlYJt.jpg
        alt: Mickey D’s near Takashimaya
        caption: 'The Mickey D’s downtown was running a Detective Conan collaboration, complete with a burger shaped like Ran’s hair.'
        lat: 35.00373
        lng: 135.7675472
      - src: https://blog-img.774352199.xyz/GXtuL9.webp
        alt: Nintendo KYOTO
        caption: 'While claiming our tax refund at Takashimaya we found Nintendo KYOTO on the same floor. I had thought about picking up some cartridges in case they were cheaper. The shop turned out to stock consoles, controllers, and a great many eye-wateringly expensive figures.'
        lat: 35.00356
        lng: 135.7682194
      - src: https://blog-img.774352199.xyz/QDRn8G.jpg
        alt: A little shopping on someone else’s behalf
        caption: 'At my colleague C’s request I picked up a PS5 copy of Split Fiction at EDION, only to find once home that it was no cheaper than buying it in China.'
        lat: 35.003289
        lng: 135.769633
      - src: https://blog-img.774352199.xyz/3eYCtn.jpg
        alt: The shopping haul
        caption: 'It took wandering through several department stores to just about complete the list. With the tax refund it came to roughly 20–30% less than buying on JD.'
        lat: 35.005675
        lng: 135.759827
      - src: https://blog-img.774352199.xyz/grNniL.jpg
        alt: 'Back on the Haruka, off to the airport'
        lat: 34.985583
        lng: 135.756024
      - src: https://blog-img.774352199.xyz/BzWgH5.jpg
        alt: Scenery along the way
        caption: "We headed for the airport at around three in the afternoon, just as school was letting out. Leaning against the window I watched groups of high school students walking home in twos and threes. What youth. They say you cannot have youth and the sense of it at the same time, but some people's youth really is more youthful than others."
        lat: 34.8889527
        lng: 135.670027
      - src: https://blog-img.774352199.xyz/tRRKQ1.jpg
        alt: One last look at Japan
        lat: 34.4334416
        lng: 135.2434527
