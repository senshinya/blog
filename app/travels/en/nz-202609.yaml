        caption: Buildings in South Island cities are low-rise. Even the city centre has little three- or four-storey blocks like these, with detached houses a little further out. Owning a house with a garden in the middle of town seems perfectly ordinary here. Back in China, that's a rarity.
        lat: -43.5266267
        lng: 172.633295
      - src: https://blog-img.774352199.xyz/GL9p94.webp
        alt: Around town, 2
        caption: Christchurch is known as the Garden City. It's full of parks and green spaces like these, plus statues, artwork and historic buildings of every sort. There was even a wooden artwork right next to our hotel.
        lat: -43.5267014
        lng: 172.633505
      - src: https://blog-img.774352199.xyz/KT9Jnk.webp
