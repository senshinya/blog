        alt: A350
        caption: My first flight on a China Southern A350. It felt reassuringly solid. I wonder when I'll get to try an A380. Almost every airport had one from either Saudia or Emirates; I couldn't tell which. They looked magnificent.
        lat: 23.4009417
        lng: 113.3044056
