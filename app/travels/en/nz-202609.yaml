  - day: 3
    title: Whale Watching in Kaikōura
    shortTitle: Kaikōura Whales
    descriptions:
      - The first outing the travel agency had arranged was a whale-watching trip from Kaikōura.
      - At New Zealand's latitude, even relatively low mountains can have snowy peaks. Kaikōura sits on the South Island's east coast, with sea, meadows and snow-capped mountains all in view at once. The weather played along with another sunny day. Under blue skies and white clouds, the scenery was gorgeous.
      - "I'd done my homework and bought seasickness tablets, so I took one before boarding. It was very rough out at sea. Crew members kept watch for signs of whales; whenever they spotted something, the boat sped over, stopped nearby, and we waited for a whale to break the surface. We got lucky: the whales seemed keen to put on a show, surfacing again and again to cheers from everyone on board. A pod of dolphins also swam alongside us along the way."
      - Whale breath absolutely reeks, though.
    photos:
      - src: https://blog-img.774352199.xyz/oSINYy.webp
        alt: On the way, 1
        caption: 'Most of the journey looked like this: wide pastures beneath snowy mountains, with hundreds or thousands of cattle and sheep ambling about, grazing or resting.'
        lat: -43.1250806
        lng: 172.7331861
      - src: https://blog-img.774352199.xyz/TNCPeU.webp
        alt: On the way, 2
        caption: A railway followed our route too, though we didn't get to see a train. This stretch is part of the Coastal Pacific scenic train route.
        lat: -43.1096611
        lng: 172.7362972
      - src: https://blog-img.774352199.xyz/xoVn0J.webp
        alt: What a view
