  - day: 2
    title: Christchurch
    shortTitle: Christchurch
    descriptions:
      - The travel agency had left our first day free for us to explore Christchurch.
      - Fine by me. A lie-in it was.
      - We'd planned a wander in the morning, but got caught in a sudden downpour with howling wind. I could barely lift my head into it. We made it as far as a nearby supermarket, picked up some ingredients, then took a DiDi back to the hotel to cook lunch. Yes, actual DiDi, the overseas version of the Chinese app.
      - The weather cleared in the afternoon, so we went out for a walk.
    photos:
      - src: https://blog-img.774352199.xyz/KoIcyI.webp
        alt: My first attempt at steak!
        caption: Meat in New Zealand is cheap compared with fruit and veg. We bought steaks, sausages, salt and oil at New World, the supermarket Chinese visitors call the “red supermarket”, and I had my first go at pan-frying steak back at the hotel. It was easier than I'd expected, apart from getting the doneness right. The steak in the photo was basically raw inside when I cut it open… The fried egg was lovely, though.
        lat: -43.5270944
        lng: 172.6327056
