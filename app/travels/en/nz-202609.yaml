slug: nz-202609
title: New Zealand’s South Island
subtitle: '2026.9'
posttitle: 'Travel Journal: New Zealand’s South Island (September 2026)'
description: |-
  With the Mid-Autumn and National Day holidays,
  three days of annual leave bought us thirteen days off.
  So off we went to the Southern Hemisphere.
published: 2026-10-13
totaldays: 13
coverImage: https://blog-img.774352199.xyz/S69z5t.png
coverCaption: Snowy mountains and sea in Kaikōura
ending: Well then, time to say goodbye.
days:
  - day: 1
    title: Getting There
    shortTitle: Getting There
    descriptions:
      - "A few months earlier, I was feeling rather pleased with the bargain flights I'd found. By the time we were on them, I wasn't laughing. The connections were a slog: Shanghai to Guangzhou, Guangzhou to Auckland, then Auckland to Christchurch. Coming home would be Christchurch to Auckland, Auckland to Beijing, and Beijing to Shanghai. After the very first leg I started looking into upgrades. Fortunately, an upgrade costing five times the original fare put a stop to that."
      - I'm a light sleeper with somewhat frayed nerves, and I'm a bit scared of flying. Add the noise and turbulence, and sleep on a plane is pretty much impossible. To top it off, none of our flights in either direction had Wi-Fi. I spent the long nights staring at the seatback entertainment screen.
      - On the plus side, I got to fly on an Airbus A350 for the first time. Overall, it was more comfortable than the Boeing 787-9 on the way home. The A350's entertainment system lets you watch live feeds from several cameras outside the aircraft, which made take-off and landing fun to watch.
      - Once we'd landed and checked into the hotel, all I wanted to do was crash.
