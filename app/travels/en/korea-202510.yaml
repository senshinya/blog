  - day: 5
    title: 'Back in Seoul, After Dark'
    descriptions:
      - 'We got back to Seoul in the evening, and the noise of a grill table finally took some of the edge off the day. After eating we kept walking — ice cream, clothing stalls and shopping-mall signage pushed us back into the weekend crowd.'
