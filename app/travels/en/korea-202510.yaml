        caption: 'We finished the evening with fried chicken and beer. After a day of walking, the portions looked about right.'
        lat: 35.161047
        lng: 129.16125
  - day: 4
    title: 'North: A Short Transfer Day'
    descriptions:
      - 'The morning began with being startled awake by an “extremely severe” emergency alert on my phone; when I read it properly, I realised it was an emergency medical notice for the Chuseok holiday. Koreans were celebrating; we were on luggage-and-city-change duty.'
      - 'We ate lunch in Busan and headed north, reaching Seoul in the evening. No sights were planned for a transfer day — a platform, a hot pot of stew and an egg toastie were enough to account for it.'
    photos:
      - src: https://blog-img.774352199.xyz/EHXTfN.jpg
        alt: A Chuseok emergency alert
        caption: 'An “extremely severe” alert appeared on my phone in the morning; translated, it turned out to be an emergency medical notice for the Chuseok holiday.'
      - src: https://blog-img.774352199.xyz/2eGvwe.jpg
        alt: Bibimbap before leaving Busan
        caption: "A bowl of bibimbap before leaving Busan, considerably more colourful than a transfer day's itinerary."
        lat: 35.115175
        lng: 129.039292
      - src: https://blog-img.774352199.xyz/zjiQKw.jpg
        alt: Omurice and sides
        caption: My travelling companion went for omurice. Two lunches taking different routes to the same objective.
        lat: 35.115178
        lng: 129.039286
      - src: https://blog-img.774352199.xyz/t5zl3a.jpg
        alt: Arriving at Seoul Station
        caption: "A few hours later we were standing on a platform in Seoul, and Busan's sea was officially left down south."
        lat: 37.5534
