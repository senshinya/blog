        lat: 35.16185
        lng: 129.160244
  - day: 3
    title: The Sea from a Cable Car
    descriptions:
      - 'Day three we moved to Songdo. After lunch we took the cable car across the bay, with the water, the hillside and the city sliding along beneath us — the only challenge was the fear of the glass floor, so it was best not to keep looking down.'
      - 'Distance behaves strangely inside a cable car. The far shore looks close, yet the bay refuses to end. It was only when the towers started to loom that I realised we had crossed most of Songdo.'
    photos:
      - src: https://blog-img.774352199.xyz/TIi3un.jpg
        alt: A pot of hot soup before the cable car
        caption: Lunch was settled with a pot of hot soup before we went to the cable car.
        lat: 35.161683
        lng: 129.160558
      - src: https://blog-img.774352199.xyz/8ZSo2E.jpg
        alt: The Songdo cable car and the coast
        caption: 'The car left the station and the hillside, the water and the city opposite opened out together.'
        lat: 35.070572
        lng: 129.022419
      - src: https://blog-img.774352199.xyz/nysbC8.jpg
        alt: A cable car coming the other way
        caption: 'Another cabin slid past in front of the rocks, adding a little movement to an otherwise still seascape.'
        lat: 35.070572
        lng: 129.022419
      - src: https://blog-img.774352199.xyz/fy4Cp5.jpg
        alt: Feet in a glass-floored cabin
        caption: The sea is directly under the glass. My feet knew it was safe; my eyes were less convinced.
        lat: 35.067303
        lng: 129.021761
      - src: https://blog-img.774352199.xyz/Eau0rl.jpg
        alt: The cable line towards the city
        caption: The line points straight at the skyline. You can see the destination; judging the distance is harder.
        lat: 35.062472
        lng: 129.020742
      - src: https://blog-img.774352199.xyz/NuI5Rl.jpg
        alt: A cabin above the water
        caption: 'Shot vertically, the cable car looks as though it climbs straight out of the sea and in among the towers.'
        lat: 35.062472
        lng: 129.020742
  - day: 3
    title: 'Songdo: Streets and the Skywalk'
    descriptions:
      - 'After getting off the cable car we walked the skywalk out over the water, and spent what was left of the day without chasing any more sights. We made our way back into town past a cat in the park, a crow on a lamp post and a piece of street sculpture.'
      - 'Looking at the bay once more from higher up, the cable car we had just ridden was reduced to a very thin line. In the evening we came back to the busy blocks and closed out our last full day in Busan with fried chicken and beer.'
    photos:
      - src: https://blog-img.774352199.xyz/pJ2oAE.JPG
