  - day: 6
    title: Up Namsan into the Evening
    descriptions:
      - 'In the afternoon we carried on up Namsan. By the time N Seoul Tower showed itself through the trees the light had all but gone, and once the tower lit up green, the view from the top was nothing but city lights.'
      - 'Coming back down into the shopping streets, Seoul returned to its usual volume at once. We finished with a pot of hot soup and a bowl of steamed egg, a leisurely dinner to end our busiest day of the trip.'
    photos:
      - src: https://blog-img.774352199.xyz/26ysHs.jpg
        alt: A monument beside the Namsan route
        caption: 'We carried on up Namsan in the afternoon, the monument by the path marking the start of the climb.'
        lat: 37.557156
        lng: 126.983614
      - src: https://blog-img.774352199.xyz/yp95u3.jpg
        alt: The steep incline track
        caption: 'The track runs almost straight up — seemingly easier than walking, and steeper than I had imagined.'
        lat: 37.556972
        lng: 126.983558
      - src: https://blog-img.774352199.xyz/WefO9m.jpg
        alt: An old cable car illustration on the wall
        caption: An illustration of the old cable car on the wall gives this part of the journey a touch of the past.
        lat: 37.556672
        lng: 126.984253
      - src: https://blog-img.774352199.xyz/IQEHwh.jpg
        alt: N Seoul Tower through the trees
        caption: 'As the light went, part of N Seoul Tower showed itself first through the leaves.'
        lat: 37.552
        lng: 126.987456
      - src: https://blog-img.774352199.xyz/mxUsp1.jpg
        alt: N Seoul Tower lit green
        caption: 'The tower lit up green, and our daytime climb gave way to an evening of city views.'
        lat: 37.551736
