        lat: 35.188592
        lng: 129.223344
  - day: 2
    title: 'Gijang: Sea and Evening'
    descriptions:
      - 'Leaving the temple we carried on along the coast, and the sights quickly turned into street corners, residential blocks and a rail line running right beside the water. The sea stayed next to us the whole time; only the foreground changed at every bend.'
      - 'We caught the sunset in the evening, with the tracks, the sea and the distant towers all stacked into one frame. Once we had had enough of the water we went back into town for grilled meat, and only then did the day properly end.'
    photos:
      - src: https://blog-img.774352199.xyz/c7yZCq.jpg
