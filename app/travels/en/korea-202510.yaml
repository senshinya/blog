title: South Korea
subtitle: '2025.10'
posttitle: 'Travel Journal: South Korea (October 2025)'
description: 'Landed in Busan and worked our way up the coast to Seoul. Seven days of sea, temples, the border, palaces and city lights at night, and every meal taken seriously.'
published: 2026-08-17
totaldays: 7
coverImage: https://blog-img.774352199.xyz/rfbX78.jpg
days:
  - day: 1
    title: 'Arriving in Busan: First Night by the Sea'
    descriptions:
      - 'By the time the plane touched down at Gimhae, most of the day was already gone. Dragging our luggage onto the subway, my first impression of Korea was how quiet the platform was — and then, once we were in the city, how each sign was brighter than the last.'
      - 'We went down to the sea anyway after dropping off our bags. Haeundae was almost empty at that hour, the tower blocks lining the shore with their lights. A short first day, just long enough to shake off the travelling.'
    photos:
      - src: https://blog-img.774352199.xyz/DLNdZy.jpg
        alt: Arriving at Gimhae Airport
        caption: The first photo at the airport. Both I and my luggage had landed; my head was still in transit.
        lat: 35.171903
        lng: 128.948506
      - src: https://blog-img.774352199.xyz/xoAPra.jpg
        alt: A Busan subway platform
        caption: The first leg from the airport into the city began on a very quiet subway platform.
        lat: 35.1634
        lng: 128.984025
      - src: https://blog-img.774352199.xyz/aDIuj7.jpg
        alt: A shopping street by the sea
        caption: 'The street near where we stayed was narrow, with signage lit from the ground floor all the way to the roof.'
        lat: 35.163247
        lng: 129.158942
      - src: https://blog-img.774352199.xyz/Xe0RQq.jpg
        alt: Shop signs at night
        caption: 'Turning to look the other way: Busan at night is a good deal livelier than that platform was.'
        lat: 35.163011
        lng: 129.159344
      - src: https://blog-img.774352199.xyz/PKe4W6.jpg
        alt: Haeundae beach late at night
        caption: 'It was already very late, and the beach had emptied out, leaving only a row of lights in the distance.'
        lat: 35.159397
        lng: 129.162444
      - src: https://blog-img.774352199.xyz/hUB6QE.jpg
        alt: Surf on wet sand
        caption: 'You cannot make out the colour of the sea at night, but the white edge of the waves on the wet sand is perfectly clear.'
        lat: 35.158586
        lng: 129.162442
      - src: https://blog-img.774352199.xyz/ZHJVJJ.jpg
        alt: The beach and the towers along the shore
        caption: Looking back you can see the towers along the coast; here the city and the sea are almost pressed together.
        lat: 35.158806
        lng: 129.162481
  - day: 2
    title: Along the Coast
    descriptions:
      - "I finally saw the sea properly from the window after waking up. Lunch was a pot of beef and glass noodles, bibimbap and a ring of side dishes — the table was better filled than the day's itinerary."
      - 'In the afternoon we went to Haedong Yonggungsa. The temple spreads down along the rocky shore, and the stone steps, pines and rooflines cut the sea into sections; only at the very bottom can you see the open sea unobstructed again.'
    photos:
      - src: https://blog-img.774352199.xyz/EN4xux.jpg
