  - day: 7
    title: 'Half a Day Left, and the Flight Home'
    descriptions:
      - 'Only half a day remained. After a large plate of grilled chicken we went to the Starfield Library. The walls of books inside the mall are high enough to feel slightly unreal, and the escalators carrying people straight through the middle look more like the everyday reality of the place than quiet reading does.'
      - 'We left for Incheon Airport in the evening and flew back to Shanghai that night. When familiar city lights reappeared under the wing, the seven days had been used up exactly, with no day needing another sight forced into it.'
    photos:
