        lat: 37.553531
        lng: 126.920636
  - day: 5
    title: South of the Border
    descriptions:
      - 'Visiting the DMZ means following a fixed route: first a tour bus, then a slow trip north between a memorial, a suspension bridge and a few viewpoints. On the map the border is a line; in front of you there are only fields, towns and hills under an overcast sky.'
      - 'Zoom in and the towers in the woods, the tank by the road and the vehicle barriers appear one by one. The quiet here is not the quiet of ordinary countryside; even the riverside road on the way back made us instinctively say less.'
    photos:
      - src: https://blog-img.774352199.xyz/zqWti8.jpg
        alt: Tour buses for the DMZ trip
        caption: You cannot simply wander to the border; the trip starts with a row of tour buses waiting to leave.
        lat: 37.890261
        lng: 126.740819
      - src: https://blog-img.774352199.xyz/vezfhd.jpg
        alt: A memorial at the border site
        caption: 'The memorial puts the history behind this landscape in front of you, and the mood turns sombre.'
        lat: 37.889764
        lng: 126.739586
      - src: https://blog-img.774352199.xyz/nAo1h6.jpg
        alt: A suspension bridge behind the trees
        caption: 'Further on from the memorial, a short section of the suspension bridge shows through the trees.'
        lat: 37.889997
        lng: 126.738881
      - src: https://blog-img.774352199.xyz/eQpG7l.jpg
        alt: A traditional pavilion on the hillside
