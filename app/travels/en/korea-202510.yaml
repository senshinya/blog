        caption: 'Back on the street after the sights, the ordinary life of a seaside town takes over again.'
        lat: 35.166689
        lng: 129.183697
      - src: https://blog-img.774352199.xyz/qRCYuU.jpg
        alt: The coastal rail line by day
        caption: 'By day the tracks run out along the shore, holding a place for the sunset later on.'
      - src: https://blog-img.774352199.xyz/DyQHqe.jpg
        alt: Evening glow over the sea
        caption: 'The sun went down slowly. There was nobody on the water, and nothing else to clutter the view.'
        lat: 35.155633
        lng: 129.177353
      - src: https://blog-img.774352199.xyz/Q8A3dI.jpg
        alt: 'Sunset, tracks and distant towers'
