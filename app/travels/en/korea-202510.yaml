        lng: 126.923625
  - day: 6
    title: Palaces and the Old City
    descriptions:
      - 'We did not get up especially early. Fried chicken first, then Gyeongbokgung. It stayed overcast all day, Bugaksan rising behind the palace walls, half hidden by mist, which somehow made the painted eaves stand out more than they would have in sunshine.'
      - 'From the palace gate we walked down to Gwanghwamun Square and then turned into the old city. Traditional roofs, modern office blocks and ordinary streets sit very close together here; one intersection and you are in a different period.'
    photos:
      - src: https://blog-img.774352199.xyz/U9hglv.jpg
        alt: Fried chicken for lunch
        caption: 'We slept until midday and opened the day with fried chicken, setting nutritional balance aside for now.'
        lat: 37.555208
        lng: 126.921294
