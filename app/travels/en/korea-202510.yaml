        caption: 'The meat sizzled on the plate, and the mood that had been weighing on the day finally eased a little.'
        lat: 37.553244
        lng: 126.920572
      - src: https://blog-img.774352199.xyz/KXNWVZ.jpg
        alt: Ice cream on an evening walk
        caption: 'We kept walking after dinner, with one clear goal for now: finish the ice cream in my hand.'
        lat: 37.553061
        lng: 126.921106
      - src: https://blog-img.774352199.xyz/04H1g5.jpg
        alt: A clothing stall on the street
