        caption: 'The skywalk reaches out over the water, and the people ahead give the walkway its sense of scale.'
      - src: https://blog-img.774352199.xyz/gFD7qT.jpg
        alt: A cat in the seaside park
        caption: The cat in the park had no interest in tourists and was minding its own patch of sunshine.
        lat: 35.061317
        lng: 129.020047
      - src: https://blog-img.774352199.xyz/VYvmUX.jpg
        alt: A crow on a lamp post
        caption: 'A crow perched on a lamp post and watched for a while, like another of the regulars here.'
