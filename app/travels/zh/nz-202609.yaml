  - day: 3
    title: 凯库拉追鲸
    shortTitle: 凯库拉追鲸
    descriptions:
      - 旅行社安排的首个行程便是从凯库拉出海追鲸。
      - 新西兰由于纬度原因，较低矮的山也会有雪顶。凯库拉位于南岛东海岸，在这里能同时看到大海、草甸和雪山。当日天公作美，又是个晴天。蓝天白云之下，风景绝美。
      - 提前做过功课买了晕船药，登船前吃了一颗。海上风浪极大，船上会有工作人员四处瞭望负责寻找鲸鱼的痕迹。一旦发现便会加足马力前往痕迹附近后停船，随后便静待鲸鱼跃出水面。我们运气很好，鲸鱼的表现欲都很高，频频跃起引来游客阵阵欢呼。途中还遇到了海豚群在船身周围结伴而行。
      - 只是鲸鱼喷气的味道属实很臭。
