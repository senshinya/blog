  - day: 4
    title: 羊驼与星空
    shortTitle: 羊驼与星空
    descriptions:
      - 阿卡罗阿的郊外山坡上，有一座羊驼牧场，牧场的员工大都是台湾人，交流起来没有障碍。
      - 他们热情地向我们介绍每匹羊驼的名字、个性、脾气和爱好，如同介绍自己的好朋友。
      - 随后，驱车前往特卡波。那里位于麦肯齐国际暗夜保护区，我生平第一次看到了银河。
    photos:
      - src: https://blog-img.774352199.xyz/3q4cfe.webp
        alt: 被rua也要干饭
        caption: 羊驼的毛十分厚实，手指能直接插进去狠狠地 rua。羊驼的脾气也很温顺，只是自顾自地吃饭。
        lat: -43.7912528
        lng: 172.9052889
      - src: https://blog-img.774352199.xyz/F5hCNn.webp
        alt: 你瞅啥
        caption: 不过有些羊驼的脾气也没有那么好，幸而也没有十分恶劣。不喜欢被 rua 也只是快速跑开，并不会吐口水。事实上最终只看到过一次两只羊驼为了争夺草料相互吐口水。
