  - day: 1
    title: 在路上
    shortTitle: 在路上
    descriptions:
      - 几个月前我还在为订到了低价方案而偷乐，等到真正坐飞机时就笑不出来了。转机方案十分折腾：先从上海飞广州中转，再从广州飞奥克兰，最后奥克兰飞基督城；返程则是基督城飞奥克兰，奥克兰飞北京，北京飞上海。飞完第一程后我就开始研究怎么升舱，还好比票价贵五倍的升舱费阻止了我。
      - 我是有点神经衰弱的，再加上有些恐飞，噪音+颠簸使我在飞机上基本无法入睡。运气不够好的是，往返的飞机上都没有提供 WiFi。最终只能盯着椅背的娱乐屏，度过漫漫长夜。
      - 不过好在，也是第一次坐上了空客的 A350。整体体验确实比返程的波音 B787-9 舒适一些。A350 的娱乐屏可以观看机身外几个位置的摄像头的实时画面，起飞和降落时能看到许多有趣的画面。
      - 下飞机到酒店入住后，只想倒头大睡。
