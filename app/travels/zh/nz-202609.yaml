  - day: 2
    title: 基督城
    shortTitle: 基督城
    descriptions:
      - 旅行社没有给第一天安排行程，供我们在基督城自由探索。
      - 正合我意，早上睡饱。
      - 上午计划去出门逛一逛，突逢疾风骤雨。狂风吹得头都抬不起来，勉强步行到附近的超市买了些食材，打滴滴（确实是 DiDi，滴滴海外版）回酒店做了顿午饭。
      - 下午天气放晴，于是出门走走。
