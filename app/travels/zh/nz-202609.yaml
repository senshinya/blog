        lng: 167.9170222
      - src: https://blog-img.774352199.xyz/fmsqjy.webp
        alt: 沿岸其三
        lat: -44.6636472
        lng: 167.9156333
      - src: https://blog-img.774352199.xyz/Pn4IeG.webp
        alt: 入海口
        caption: 从前看讲解，说峡湾是我国唯一没有的地貌。但小红书上很多人说和三峡差不太多。峡湾是被海水淹没的冰川谷，三峡则由河流切割形成。单看“峡”的部分，与米尔福德或许真的没差多少。
        lat: -44.604125
        lng: 167.8225111
      - src: https://blog-img.774352199.xyz/e8HNEN.webp
        alt: 沿岸其四
        caption: 有了参照物，山的大小便显现了出来。
        lat: -44.5997861
        lng: 167.8166194
      - src: https://blog-img.774352199.xyz/BMo7jf.webp
        alt: 沿岸其五
        lat: -44.6101417
        lng: 167.8710944
      - src: https://blog-img.774352199.xyz/g4dKp6.webp
        alt: 搭个便船回岸边
        lat: -44.6629528
        lng: 167.9186861
      - src: https://blog-img.774352199.xyz/1QwP4v.webp
        alt: 小镇蒂阿瑙
        caption: 晚上来到了湖边小镇蒂阿瑙，这里的商业化程度很低，人烟稀少。除了少数本地居民，基本就只有来往峡湾的游客暂住，十分宁静。
        lat: -45.4220167
        lng: 167.7184139
      - src: https://blog-img.774352199.xyz/vXSfm0.webp
