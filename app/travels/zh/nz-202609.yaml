  - day: 9
    title: 峡湾
    shortTitle: 峡湾
    descriptions:
      - 米尔福德峡湾在新西兰西岸，是世界上最潮湿的地区之一，一年有 200 多天都在下雨。去峡湾，看的是末世感：水雾弥漫、乌云压顶，岩壁上涌现出成百上千条瀑布。
      - 然而，我的运气真的很好（或者很不好），一年里难得的超级大晴天被我碰上了。于是，我也观赏到了这稀有的美景。
    photos:
      - src: https://blog-img.774352199.xyz/UGw319.webp
        alt: 风吹草低现牛羊
        caption: 我在新西兰见过的牛马，没有一万也有上千，每一只活得都比中国的牛马舒服。
        lat: -45.4672083
        lng: 167.7928306
      - src: https://blog-img.774352199.xyz/Gxpgrf.webp
        alt: 盘山路
        caption: 从皇后镇到峡湾需要穿越南阿尔卑斯山，后半段道路基本都是这样的盘山道，穿梭在峡谷间。重岩叠嶂，隐天蔽日。
        lat: -44.76015
        lng: 167.9690694
      - src: https://blog-img.774352199.xyz/MoeLJz.webp
        alt: 米尔福德君主号
        caption: 大游轮被我拍成小游艇了，或许我该去军宣报到。
        lat: -44.6685222
        lng: 167.9264667
      - src: https://blog-img.774352199.xyz/YlqWVM.webp
        alt: 沿岸其一
        lat: -44.6669222
        lng: 167.9216472
      - src: https://blog-img.774352199.xyz/ELMRmv.webp
        alt: 沿岸其二
