        lat: -44.0047139
        lng: 170.4738472
      - src: https://blog-img.774352199.xyz/S16Xz3.webp
        alt: 银河其二
        caption: 甚至不需要专业的相机，只需打开手机夜景模式随手一拍。
        lat: -44.0047083
        lng: 170.4738306

  - day: 5
    title: 雪山
    shortTitle: 雪山
    descriptions:
      - 头天晚上和同事 C 聊天，当得知我要去库克雪山徒步时，他极力推荐我报名冰山直升机项目：在山脚机场乘坐飞机绕山飞行，最终降落在山脊雪面上。由于是临时起意，直升机都被订完了，最终我们预订了滑雪飞机 55 分钟的体验。
    photos:
      - src: https://blog-img.774352199.xyz/FaRPbt.webp
        alt: 沿途其一
        caption: 晨雾尚未散去。
        lat: -44.1846583
        lng: 170.1189583
      - src: https://blog-img.774352199.xyz/ItLLGS.webp
        alt: 沿途其二
        caption: 库克雪山的腰间缠着一层云，司导说我们运气很好，这个景色并不常见。
        lat: -44.0518806
        lng: 170.1341083
      - src: https://blog-img.774352199.xyz/nztrGr.webp
        alt: 雪山下的机场
        caption: 库克山机场位于山谷中央，只有一条短短的跑道，用于起降小型滑雪飞机。
        lat: -43.7661061
        lng: 170.1325589
      - src: https://blog-img.774352199.xyz/xZhoLo.webp
        alt: 滑雪小飞机
        caption: 滑雪飞机很小，连带驾驶员只能承载七八个人，登机都得将座椅放倒，弯腰低头。
        lat: -43.7660642
        lng: 170.1325042
      - src: https://blog-img.774352199.xyz/mHHv4c.webp
        alt: 舷窗雪山
        caption: 起飞后，npy 一直拿着 pocket 录制窗外风景，全然不知这个 pocket 即将迎来怎样的命运。
        lat: -43.7668333
        lng: 170.1350861
      - src: https://blog-img.774352199.xyz/ZGoUPG.webp
        alt: 河谷
        caption: 此时是初春，由于冰雪初融，山谷中的河流还处于枯水期，远比河床要细小得多。
        lat: -43.657775
        lng: 170.2068333
      - src: https://blog-img.774352199.xyz/RhqV9j.webp
        alt: 层雪叠嶂
        lat: -43.6391194
        lng: 170.1855472
      - src: https://blog-img.774352199.xyz/LDAIdq.webp
        alt: 飞越雪顶
        caption: 云海上长出了雪山。
        lat: -43.5263139
        lng: 170.1342917
      - src: https://blog-img.774352199.xyz/gkPGVP.webp
        alt: 积雪覆盖下的蓝冰
        lat: -43.5103639
        lng: 170.2130889
      - src: https://blog-img.774352199.xyz/BoFh2i.webp
        alt: 降落！
        caption: 我们最终在一片较为平坦的山坡上降落，积雪深及脚踝，周围一点声音也没有，十分空灵。只有纯粹的白，和纯粹的蓝。
        lat: -43.4900156
        lng: 170.2653103
      - src: https://blog-img.774352199.xyz/qQ4VyE.webp
        alt: 与飞行员的合影
        caption: |-
          和飞行员闲聊了几句。他并不以此为业，飞行只是他的爱好，他已经驾驶飞机七年了。在库克山飞这样的观光飞机，他并不会获得任何报酬。
          respect + 羡慕。
        lat: -43.490075
        lng: 170.2653361
      - src: https://blog-img.774352199.xyz/ZKOo6W.webp
        alt: 重新起飞
        lat: -43.4864056
        lng: 170.2369083
      - src: https://blog-img.774352199.xyz/NK4b3Z.webp
        alt: 补给小屋
        lat: -43.6354306
        lng: 170.1740889
      - src: https://blog-img.774352199.xyz/sqm69k.webp
        alt: 山谷风光
        caption: 落地后我们又前往了塔斯曼冰川步道。这是一条很短的徒步路线，会爬一座小山，俯瞰蓝冰湖，往返仅约一小时，比较休闲。
        lat: -43.6977806
        lng: 170.1657556
      - src: https://blog-img.774352199.xyz/XGhlDa.webp
        alt: “蓝”湖
        caption: 登山过程中，可以看到一汪小湖。旁边的标识牌说它叫蓝湖。这个名字来自于一百多年前，这个湖由冰川融水注满，呈现出湛蓝色。然而近几十年来，冰川活动导致它无法再获得冰川融水，现在的湖被雨水注满，只能呈现出浅绿色。人们只能从它的名字中窥见那一抹蓝色。
        lat: -43.6964278
        lng: 170.1666417
      - src: https://blog-img.774352199.xyz/2ZutqI.webp
        alt: 塔斯曼冰河湖
        caption: 步道的尽头是塔斯曼冰河湖，是由塔斯曼冰川后退而形成的，在上个世纪九十年代才形成湖泊。湖的尽头就是塔斯曼冰川，湖面上漂浮着无数冰块，都是从冰川上崩解而来。
        lat: -43.6959306
        lng: 170.1683667
      - src: https://blog-img.774352199.xyz/thdo3p.webp
        alt: 高山三文鱼
        caption: 返程途中路过了普卡基湖畔的高山三文鱼店。这个店也十分有名，店里和湖边排满了来购买三文鱼的游客。这里的三文鱼是养在冰川融水中，据说十分鲜美。我们也跟风买了一盒。
        lat: -44.1899222
        lng: 170.1398306
      - src: https://blog-img.774352199.xyz/bOh9j3.webp
        alt: 最贵鸟食
        caption: 由于我们都吃不惯生食，最终这些三文鱼都便宜了海鸥们（姑且将其称为海鸥）。这绝对是我喂鸟用过的最贵的鸟食了，一盒 20 刀。
        live: https://blog-img.774352199.xyz/hx0FOJ.mp4
        lat: -44.001594
        lng: 170.472519
      - src: https://blog-img.774352199.xyz/wOOQ30.webp
        alt: 香料饭
        caption: 晚饭在特卡波湖畔的一家印度餐厅解决。我点了一份印度香饭。说实话味道十分恐怖，像是在往嘴里塞各种香料，饭里的肉味米味，全部被香料那直冲天灵盖的味道盖住。难怪英国要殖民印度，香料和不要钱似的。
        lat: -44.0038222
        lng: 170.4768222

  - day: 6
    title: 赶路
    shortTitle: 赶路
    descriptions:
      - 离开特卡波湖后，我们便前往皇后镇。
    photos:
      - src: https://blog-img.774352199.xyz/WDTSJi.webp
        alt: 瓦纳卡湖畔其一
        caption: |-
          中午时分到达了瓦纳卡镇。
          在提前做的攻略里，瓦纳卡是一个很宁静的小镇，游客很少。但在国内连休 + 澳新学校假期双重加持下，瓦纳卡也开始出现了公共厕所排队的情况。
        lat: -44.6990083
        lng: 169.1255806
      - src: https://blog-img.774352199.xyz/c4Q5hH.webp
        alt: 双宿双栖
        lat: -44.6979311
        lng: 169.1287964
      - src: https://blog-img.774352199.xyz/IQjGir.webp
        alt: 孤独的树
        caption: 最著名的瓦纳卡景点，甚至是最著名的新西兰景点，一棵长在湖中的柳树。事实上，常年被长枪短炮怼着，相比于它岸上的兄弟姐妹们，却一点不显孤独了。
        lat: -44.6988339
        lng: 169.1179356
      - src: https://blog-img.774352199.xyz/L71UEi.webp
        alt: 瓦纳卡湖畔其二
        lat: -44.6985272
        lng: 169.1172894
      - src: https://blog-img.774352199.xyz/HdSfpO.webp
        alt: 淘金小镇箭镇
        caption: 皇后镇旁的箭镇，起源于 19 世纪的淘金热。由于禁止了机械化采矿，据说现在在河畔还能淘到金砂。镇上的纪念品也多是以黄金为主题，十分讨喜。
        lat: -44.93835
        lng: 168.8309028
      - src: https://blog-img.774352199.xyz/zrbuIY.webp
        alt: 酒店阳台
        caption: 我们到达了皇后镇的酒店并办理好入住。从皇后镇的酒店阳台向外看出去，能看到一角瓦卡蒂普湖。
        lat: -45.0345806
        lng: 168.6678472
      - src: https://blog-img.774352199.xyz/yXkDCy.webp
        alt: 阴云密布
        caption: 傍晚的皇后镇开始阴云密布。不禁担心起了第二天的跳伞行程。
        lat: -45.0301694
        lng: 168.6612861
      - src: https://blog-img.774352199.xyz/RDUhK2.webp
        alt: 亚洲超市
        caption: 说是亚洲超市，其实更像是中国超市：火锅食材、火锅底料、各种中国的零食小吃、国产方便面……应有尽有。恰逢国人黄金周（双周），亚洲超市挤满了中国人，连煮火锅的卡式炉都被租完甚至是买完了。我们买了一些火锅底料和调料，以及一大包方便面和一包螺蛳粉。
        lat: -45.0305889
        lng: 168.6609028

  - day: 7
    title: shoot!
    shortTitle: shoot!
    descriptions:
      - 预约了早上六点的第一班跳伞，凌晨四点就起床收拾。五点半正准备出门时，收到了因天气原因取消跳伞的邮件。不死心，还是去了跳伞门店，最后却只能败兴而归。
      - 回到酒店又休息到了中午。连一刻都没有为跳伞取消而失落，立刻到来的是射击！
    photos:
      - src: https://blog-img.774352199.xyz/FVyYbZ.webp
        mapZoomOffset: 0.6
        alt: 初春
        lat: -45.0335361
        lng: 168.6660306
      - src: https://blog-img.774352199.xyz/JxgnfC.webp
        mapZoomOffset: 0.6
        alt: 烟屁股
        caption: 等车时看到的装置，上面写着“Butts belong in this bin”。butts 我知道是屁股，但整句话看不明白。问了 AI 才知道，这里的 butts 指烟屁股，也就是烟头 😂
        lat: -45.0307306
        lng: 168.6602639
      - src: https://blog-img.774352199.xyz/PrOvaU.webp
        mapZoomOffset: 0.6
        alt: Town Center
        lat: -45.0306972
        lng: 168.6603556
      - src: https://blog-img.774352199.xyz/Ijc2hK.webp
        mapZoomOffset: 0.6
        alt: 镇郊远眺
        caption: 靶场设在皇后镇郊外一座山上的私人牧场，射击教练就是牧场主。据教练说，牧场里养了五千只羊，占据了城郊的好几个山头。不知道是不是英国殖民时期留下的习惯，当地人闲聊时真的很喜欢聊天气，还喜欢调侃天气预报员。
        lat: -45.0037639
        lng: 168.7099611
      - src: https://blog-img.774352199.xyz/BVINEB.webp
        mapZoomOffset: 0.6
        alt: 霰弹枪
        caption: 射击用的是一把半自动霰弹枪。射击位周围有好几台陶土靶发射器，教练一按遥控器，就会有陶土靶飞出来。
        lat: -45.0058139
        lng: 168.7100528
      - src: https://blog-img.774352199.xyz/ro9M1H.webp
        mapZoomOffset: 0.6
        alt: 姿势要正
        caption: 射击前，教练先讲解姿势和要点，浅显易懂，几句话就说完了。没有反复的三令五申，松弛得有种不真实感，仿佛我们玩的是 Laser Tag。教练反复强调的只有一句：“Eyes on target”。
        lat: -45.0058528
        lng: 168.7100528
      - src: https://blog-img.774352199.xyz/Ng9QO6.webp
        mapZoomOffset: 0.6
        alt: 开枪！
        caption: 真拿起来才感受到枪的重量，大幅度移动有些费劲。不过后坐力意外地小，不知道是不是减装药量的缘故。最后每人打了约四五十发。教练的情绪价值给得十分充足，没打中还会帮我们找补。
        live: https://blog-img.774352199.xyz/zlLxt9.mp4
        lat: -45.0058472
        lng: 168.7100361
      - src: https://blog-img.774352199.xyz/vEIRTD.webp
        mapZoomOffset: 0.6
        alt: 强烈推荐
        caption: |-
          原本计划去瓦纳卡的 Real Guns，但交通不方便，也没订到合适的时间，只好改订了这个项目。没想到是个意外之喜，体验极佳。我们预约时官网没有在线预订入口，可以通过邮件或电话联系。
          官网：https://breakone.co.nz
        lat: -45.0058444
        lng: 168.7100222
      - src: https://blog-img.774352199.xyz/RDgmbB.webp
        mapZoomOffset: 0.6
        alt: 网红大脸汉堡
        caption: 返程还是在镇中心下车，顺便在附近逛了逛。偶遇大脸汉堡，小红书上的皇后镇必吃推荐，不过我毫无兴趣，只想回去涮火锅吃。
        lat: -45.0317111
        lng: 168.6593639
      - src: https://blog-img.774352199.xyz/astXwO.webp
        mapZoomOffset: 0.6
        alt: 肯记麦记
        caption: 十分和谐。
        lat: -45.0315694
        lng: 168.6614083

  - day: 7
    title: Skyline
    shortTitle: Skyline
    descriptions:
      - Skyline 坐落在皇后镇边缘的山上，初次进入皇后镇时就注意到了。从山下望去，平平无奇。为了修建缆车，山坡还被砍出了一条光秃秃的岩石带，甚至有些丑陋。
      - 但当实际登上观景台，俯瞰皇后镇和瓦卡蒂普湖，却又是另一番景象了。
      - 我们买了 Skyline 套票，包含缆车体验、三次滑车（luge），还有一顿山顶自助餐。
    photos:
      - src: https://blog-img.774352199.xyz/mOqmRj.webp
        alt: 瓦卡蒂普湖
        caption: 可能是夏令时的原因，新西兰天黑得特别晚，下午五点仍不见暮色。
        lat: -45.0331417
        lng: 168.6606611
      - src: https://blog-img.774352199.xyz/OkJTRk.webp
        alt: 缆车风景其一
        lat: -45.02905
        lng: 168.6565389
      - src: https://blog-img.774352199.xyz/ZhHGPh.webp
        alt: 缆车风景其二
        lat: -45.0275889
        lng: 168.652725
      - src: https://blog-img.774352199.xyz/W8duHW.webp
        alt: 滑车
        caption: |-
          套票里包含三次滑车体验。因为时间预留得不多，原本计划先玩一次就去吃饭，结果体验超乎想象，十分刺激，连续玩了两次仍意犹未尽。
          一共有两条滑道，Arrow 和 Dart。理论上 Arrow 更平缓悠闲，Dart 更刺激，但实际体验下来，Arrow 的刺激程度并不比 Dart 低，而且滑道更长，体验更佳。
        lat: -45.0257194
        lng: 168.6475361
      - src: https://blog-img.774352199.xyz/T1rVo8.webp
        alt: 自助餐
        caption: 自助餐中规中矩，冷饮和酒都要另付费，免费的只有咖啡、茶之类的热饮。第一次品尝了鹿肉，吃过的动物种类 +1。没有什么特殊的味道，口感和牛肉差不多。坐在餐厅窗边，就能俯瞰整个皇后镇和瓦卡蒂普湖。
        lat: -45.0264806
        lng: 168.6499028
      - src: https://blog-img.774352199.xyz/KN2GmZ.webp
        alt: 晚霞
        caption: 一直吃到晚霞爬上山头，又渐渐褪去。餐后离开餐厅时，天已经黑透了，不过 luge 还在营业，于是又坐缆车上去玩了一次。
        lat: -45.0263639
        lng: 168.6498417

  - day: 8
    title: 天堂镇天堂路
    shortTitle: 天堂镇天堂路
    descriptions:
      - 格林诺奇是南岛一个很有名的小镇，据说是《指环王》和《霍比特人》中土世界的取景地。它离皇后镇很近，车程只有半小时左右。
      - 我们预订了当地一家马场的骑马徒步。马场位于天堂镇的天堂路（Paradise），十分应景。
      - 由于前一天的跳伞被取消，我们又预约了室内跳伞。说是跳伞，更像是体验自由落体。
    photos:
      - src: https://blog-img.774352199.xyz/2DC2bu.webp
        alt: 世界十大最美公路之一
        caption: 从皇后镇前往格林诺奇，全程沿着瓦卡蒂普湖畔，湖面倒映着雪山，轻云掩映。这条路也被誉为世界十大最美公路之一。
        lat: -45.0580778
        lng: 168.59105
      - src: https://blog-img.774352199.xyz/ETWnt7.webp
        alt: 起飞
        lat: -45.0580222
        lng: 168.5909111
      - src: https://blog-img.774352199.xyz/LHvGn8.webp
        alt: 一抹亮眼的红色
        lat: -44.8515389
        lng: 168.3825833
      - src: https://blog-img.774352199.xyz/9dWLdA.webp
        alt: 噩梦红房子
        caption: 此前同事 C 也去过格林诺奇，在一个旱厕里留下了心理阴影。回国后讲给我听，害得我也做了个不太下饭的噩梦。今天终于得以窥见其真容。
        lat: -44.8527028
        lng: 168.3834528
      - src: https://blog-img.774352199.xyz/UcaXyR.webp
        alt: 饮马槽
        caption: 到达马场后，工作人员简单讲解了骑马的基本操作，已有骑马经验的我理解起来自然没有问题。我骑的这匹马叫 Smarty，似乎在马队中的地位较低（原话 low dominance），偶尔被其他马霸凌，有些可怜。徒步时也只能吊车尾，走在马队最后。
        lat: -44.8006167
        lng: 168.3762194
      - src: https://blog-img.774352199.xyz/ldsntb.webp
        alt: 飒爽
        lat: -44.8011361
        lng: 168.3758389
      - src: https://blog-img.774352199.xyz/KsqoOC.webp
        alt: 沿途其一
        lat: -44.8038778
        lng: 168.3833167
      - src: https://blog-img.774352199.xyz/ukVks1.webp
        alt: 沿途其二
        caption: 穿越里斯河（Rees River），水很浅，才能没马蹄。
        lat: -44.8026694
        lng: 168.3851611
      - src: https://blog-img.774352199.xyz/M9hPio.webp
        alt: 沿途其三
        lat: -44.8023417
        lng: 168.38585
      - src: https://blog-img.774352199.xyz/JN3G0K.webp
        alt: 嘻嘻和略略
        lat: -44.7973278
        lng: 168.3905028
      - src: https://blog-img.774352199.xyz/AHMa6R.webp
