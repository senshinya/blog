  - day: 4
    title: 向北，短暂的转场日
    descriptions:
      - 早上先被手机里“极严重”的紧急警报吓醒，仔细看才发现是中秋假期的应急医疗提醒。韩国人过节，我们负责拖着行李换城市。
      - 在釜山吃完午饭后一路向北，傍晚抵达首尔。转场日没安排景点，站台、热锅和煎蛋吐司已经足够交代这一天。
