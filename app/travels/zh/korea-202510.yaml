  - day: 2
    title: 沿海而行
    descriptions:
      - 睡醒后终于从窗边看清了海。午饭是一锅牛肉粉丝、拌饭和一圈小菜，桌面比当天的行程安排得更满。
      - 下午去海东龙宫寺。寺院贴着岩岸往下铺，石阶、松林和屋顶把海切成一段一段，走到最下面才重新看到完整的外海。
