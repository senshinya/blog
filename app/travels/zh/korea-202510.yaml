  - day: 2
    title: 机张的海与傍晚
    descriptions:
      - 从寺里出来继续沿海走，景点很快换成了街口、居民区和贴着海岸延伸的轨道。海一直在旁边，只是每转一个弯，前景都不太一样。
      - 傍晚赶上了落日，轨道、海和远处的高楼正好叠在一起。看够了海，再回到街上吃烤肉，这一天才算真正结束。
