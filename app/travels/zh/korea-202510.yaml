  - day: 3
    title: 从缆车上看海
    descriptions:
      - 第三天换到松岛。午饭后坐上跨海缆车，海面、山岸和城市都在脚下慢慢移动，唯一需要克服的是别一直盯着玻璃底看。
      - 缆车里的距离感很奇怪，对岸看着不远，海湾却怎么也走不完。等高楼越来越近，才意识到自己已经横穿了大半个松岛。
