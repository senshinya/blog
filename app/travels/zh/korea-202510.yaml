  - day: 3
    title: 松岛海边的街巷与栈道
    descriptions:
      - 下了缆车后去走海上的栈道，剩下的时间没有再追景点。公园里的猫、灯杆上的乌鸦和街头雕塑一路把人带回城区。
      - 从高处再看一次海湾，刚才坐过的缆车成了很细的一条线。晚上回到热闹街区，用炸鸡和啤酒结束釜山最后一个完整日。
