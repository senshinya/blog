  - day: 6
    title: 从南山走进夜色
    descriptions:
      - 下午继续往南山走。等首尔塔从树影里露出来，天色也差不多暗了，塔身亮起绿灯之后，山顶的视野只剩下一整片城市灯火。
      - 下山重新回到商业街，周围立刻恢复了首尔的音量。最后找了一锅热汤和一份蒸蛋，把这趟旅程里走得最满的一天安稳地吃完。
