  - day: 7
    title: 最后半日与归程
    descriptions:
      - 最后一天只剩半日，吃完一大盘烤鸡后去了星空图书馆。商场里的书墙高得有些不真实，扶梯载着人从中间穿过，倒比安静看书更像这里的日常。
      - 傍晚去仁川机场，夜里飞回上海。机翼下重新出现熟悉的城市灯光时，七天刚好用完，没有哪一天需要再硬塞一个景点。
