  - day: 5
    title: 边境线以南
    descriptions:
      - 去 DMZ 得跟着固定路线走，先坐旅游巴士，再从一处纪念碑、一座悬索桥和几个观景点之间慢慢向北。地图上的边境是一条线，眼前只有农田、城镇和阴天下的山。
      - 镜头拉近后，山林里的塔、路旁的坦克和阻车设施才逐一出现。这里的安静和普通郊外不太一样，连回程那段沿河公路都让人下意识少说几句话。
