  - day: 6
    title: 宫阙与老城
    descriptions:
      - 这一天起得不算早，先吃炸鸡，再去景福宫。天气一直阴着，宫墙后的北岳山被雾遮住一半，檐下彩绘反倒比晴天更显眼。
      - 从宫门一路走到光化门广场，再拐进老城。传统屋顶、现代写字楼和普通街道离得很近，换个路口就像换了一段时间。
