      - 傍晚回到首尔，烤肉桌上的声音总算把白天的气氛冲淡了一点。吃完继续逛街，冰淇淋、服装摊和商场灯牌把人重新塞回周末的人群里。
    photos:
      - src: https://blog-img.774352199.xyz/6dito9.jpg
