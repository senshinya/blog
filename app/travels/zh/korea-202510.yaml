posttitle: 游记：南韩（2025.10）
description: 从釜山落地，一路沿着海岸走到首尔。七天里看过海、寺庙、边境线、宫阙和城市夜景，也认真吃完了每一顿饭。
published: 2026-08-17
totaldays: 7
coverImage: https://blog-img.774352199.xyz/rfbX78.jpg
days:
  - day: 1
    title: 抵达釜山，海边初夜
    descriptions:
      - 飞机落地金海时，白天已经过去了大半。拖着行李转进地铁，韩国给我的第一印象是站台很安静，进城后的招牌却一块比一块亮。
      - 放下东西后还是去了海边。夜里的海云台几乎没人，高楼的灯沿着岸线排开，第一天不长，正好够把自己从赶路的状态里放出来。
