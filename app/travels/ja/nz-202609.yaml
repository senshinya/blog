  - day: 3
    title: カイコウラでクジラを追う
    shortTitle: カイコウラのクジラ
    descriptions:
      - 旅行会社が手配してくれた最初のツアーは、カイコウラから海に出るホエールウォッチング。
      - ニュージーランドは緯度の関係で、さほど高くない山にも雪が積もっている。南島の東海岸にあるカイコウラでは、海と牧草地と雪山を一度に眺められる。この日も天気に恵まれた。青空と白い雲の下、景色がとにかくきれい。
      - 下調べをして酔い止めを買っておいたので、乗船前に1錠飲んだ。沖は風も波もかなり強い。スタッフがあちこち見回してクジラの気配を探し、見つかると船を飛ばして近くまで行き、停船して浮上を待つ。運よくサービス精神旺盛なクジラばかりで、何度も水面に姿を見せてくれて、そのたびに歓声が上がった。途中ではイルカの群れも船に並んで泳いでいた。
      - ただ、クジラの息は本当にくさい。
    photos:
      - src: https://blog-img.774352199.xyz/oSINYy.webp
        alt: 道中 その1
        caption: 道中はだいたいこんな景色。雪山の下に広い牧場が広がり、何百、何千という牛や羊がのんびり歩いたり、草を食べたり、休んだりしている。
        lat: -43.1250806
        lng: 172.7331861
      - src: https://blog-img.774352199.xyz/TNCPeU.webp
