        caption: ドキュメンタリーで何度も登場し、子どものころ科学館でも繰り返し聞いた、大マゼラン雲と小マゼラン雲。
        lat: -44.0047139
        lng: 170.4738472
      - src: https://blog-img.774352199.xyz/S16Xz3.webp
        alt: 天の川 その2
        caption: 本格的なカメラすらいらない。スマホの夜景モードで、さっと撮るだけ。
        lat: -44.0047083
        lng: 170.4738306
  - day: 5
    title: 雪山へ
    shortTitle: 雪山へ
    descriptions:
      - 前の晩、同僚のCと話していた。アオラキ／マウント・クックへハイキングに行くと伝えると、氷河のヘリ遊覧を猛プッシュされた。麓の空港から飛び立ち、山々を巡って、最後は稜線の雪の上に着陸するらしい。急に思い立ったのでヘリはすべて満席。結局、55分間のスキープレーン体験を予約した。
    photos:
      - src: https://blog-img.774352199.xyz/FaRPbt.webp
        alt: 道中 その1
        caption: 朝霧がまだ残っている。
        lat: -44.1846583
        lng: 170.1189583
      - src: https://blog-img.774352199.xyz/ItLLGS.webp
        alt: 道中 その2
        caption: マウント・クックの中腹に雲が帯のようにかかっていた。ドライバー兼ガイドによると、あまり見られない景色で、運がいいらしい。
        lat: -44.0518806
        lng: 170.1341083
      - src: https://blog-img.774352199.xyz/nztrGr.webp
        alt: 雪山の麓の空港
        caption: マウント・クック空港は谷の真ん中にあり、小型のスキープレーンが離着陸する短い滑走路が1本だけ。
        lat: -43.7661061
        lng: 170.1325589
      - src: https://blog-img.774352199.xyz/xZhoLo.webp
        alt: 小さなスキープレーン
        caption: 機体は小さく、パイロット込みで7、8人しか乗れない。乗り込むときも座席を倒して、腰を曲げて頭をかがめる。
        lat: -43.7660642
        lng: 170.1325042
      - src: https://blog-img.774352199.xyz/mHHv4c.webp
        alt: 窓越しの雪山
        caption: 離陸後、彼女はずっとPocketで窓の外を撮影していた。このPocketにどんな運命が待っているかも知らずに。
        lat: -43.7668333
        lng: 170.1350861
      - src: https://blog-img.774352199.xyz/ZGoUPG.webp
        alt: 川の流れる谷
        caption: 春先で雪解けが始まったばかり。谷の川はまだ水が少なく、広い川床の中を細く流れていた。
        lat: -43.657775
        lng: 170.2068333
      - src: https://blog-img.774352199.xyz/RhqV9j.webp
        alt: 幾重にも連なる雪山
        lat: -43.6391194
        lng: 170.1855472
      - src: https://blog-img.774352199.xyz/LDAIdq.webp
        alt: 雪の頂を越えて
        caption: 雲海から雪山が生えている。
        lat: -43.5263139
        lng: 170.1342917
      - src: https://blog-img.774352199.xyz/gkPGVP.webp
        alt: 雪の下の青い氷
        lat: -43.5103639
        lng: 170.2130889
      - src: https://blog-img.774352199.xyz/BoFh2i.webp
        alt: 着陸！
        caption: 比較的平らな山の斜面に着陸した。雪はくるぶしまであり、周りには物音ひとつない。別世界のようだった。あるのは、まっさらな白と青だけ。
        lat: -43.4900156
        lng: 170.2653103
      - src: https://blog-img.774352199.xyz/qQ4VyE.webp
        alt: パイロットと記念撮影
        caption: |-
          パイロットと少し話した。飛行機は仕事ではなく趣味で、もう7年飛んでいるそうだ。マウント・クックでこうした遊覧飛行をしても、報酬はもらっていないという。
          尊敬するし、うらやましい。
        lat: -43.490075
        lng: 170.2653361
      - src: https://blog-img.774352199.xyz/ZKOo6W.webp
        alt: 再び離陸
        lat: -43.4864056
        lng: 170.2369083
      - src: https://blog-img.774352199.xyz/NK4b3Z.webp
        alt: 山の補給小屋
        lat: -43.6354306
        lng: 170.1740889
      - src: https://blog-img.774352199.xyz/sqm69k.webp
        alt: 谷の風景
        caption: 着陸後はタスマン氷河のトラックへ。小さな丘に登って氷河湖を見下ろす短いコースで、往復約1時間。気軽に歩ける。
        lat: -43.6977806
        lng: 170.1657556
      - src: https://blog-img.774352199.xyz/XGhlDa.webp
        alt: 「ブルー」レイク
        caption: 登る途中に小さな湖が見えた。看板によるとブルーレイクという。100年以上前は氷河の融水で満たされ、鮮やかな青色だったことから付いた名前らしい。ところが、この数十年の氷河の変化で融水が届かなくなり、今は雨水で満たされた淡い緑の湖になっている。かつての青は、名前の中にだけ残っていた。
        lat: -43.6964278
        lng: 170.1666417
      - src: https://blog-img.774352199.xyz/2ZutqI.webp
        alt: タスマン氷河湖
        caption: トラックの終点は、タスマン氷河の後退で生まれたタスマン氷河湖。湖になったのは1990年代に入ってからだという。奥には氷河があり、そこから崩れた無数の氷が湖面に浮かんでいる。
        lat: -43.6959306
        lng: 170.1683667
      - src: https://blog-img.774352199.xyz/thdo3p.webp
        alt: 高山育ちのサーモン
        caption: 帰り道、プカキ湖畔の有名なサーモン店に寄った。店内も湖畔も、サーモンを買いに来た観光客でいっぱい。氷河の融水で育てていて、とてもおいしいらしい。つられて一箱買ってみた。
        lat: -44.1899222
        lng: 170.1398306
      - src: https://blog-img.774352199.xyz/bOh9j3.webp
        alt: 人生で一番高い鳥の餌
        caption: 二人とも生で食べるのに慣れていなくて、結局サーモンは全部カモメたちのごちそうになった。カモメかどうかはさておき。一箱20NZドル。鳥にあげた餌の中で、間違いなく過去最高額。
        live: https://blog-img.774352199.xyz/hx0FOJ.mp4
        lat: -44.001594
        lng: 170.472519
      - src: https://blog-img.774352199.xyz/wOOQ30.webp
        alt: スパイスご飯
        caption: 夕食はテカポ湖畔のインド料理店へ。ビリヤニを頼んだけど、正直ものすごい味だった。いろんなスパイスを直接口に詰め込んでいるみたいで、肉も米も、脳天まで突き抜ける香りに全部かき消される。イギリスがインドを植民地にしたのも分かる。スパイスをタダ同然の勢いで使っている。
        lat: -44.0038222
        lng: 170.4768222
  - day: 6
    title: 移動、また移動
    shortTitle: 移動の日
    descriptions:
      - テカポ湖をあとにして、クイーンズタウンへ向かった。
    photos:
      - src: https://blog-img.774352199.xyz/WDTSJi.webp
        alt: ワナカ湖畔 その1
        caption: |-
          昼ごろ、ワナカの町に到着。
          下調べでは、観光客の少ない静かな町のはずだった。でも中国の大型連休と、オーストラリア・ニュージーランドの学校休暇が重なり、公衆トイレにまで行列ができていた。
        lat: -44.6990083
        lng: 169.1255806
      - src: https://blog-img.774352199.xyz/c4Q5hH.webp
        alt: いつも一緒
        lat: -44.6979311
        lng: 169.1287964
      - src: https://blog-img.774352199.xyz/IQjGir.webp
        alt: ワナカの孤独な木
        caption: ワナカで一番、ひょっとしたらニュージーランドで一番有名な景色。湖の中に立つ一本の柳だ。でも一年中、大きなレンズから小さなレンズまで向けられていて、岸辺の仲間たちより孤独には見えない。
        lat: -44.6988339
        lng: 169.1179356
      - src: https://blog-img.774352199.xyz/L71UEi.webp
        alt: ワナカ湖畔 その2
        lat: -44.6985272
        lng: 169.1172894
      - src: https://blog-img.774352199.xyz/HdSfpO.webp
        alt: ゴールドラッシュの町、アロータウン
        caption: クイーンズタウン近郊のアロータウンは、19世紀のゴールドラッシュから生まれた町。機械による採掘が禁止されているため、今でも川辺で砂金が採れるらしい。お土産も金をモチーフにしたものが多くて、なかなかそそられる。
        lat: -44.93835
        lng: 168.8309028
      - src: https://blog-img.774352199.xyz/zrbuIY.webp
        alt: ホテルのバルコニー
        caption: クイーンズタウンのホテルに着いてチェックイン。バルコニーからはワカティプ湖の一角が見えた。
        lat: -45.0345806
        lng: 168.6678472
      - src: https://blog-img.774352199.xyz/yXkDCy.webp
        alt: 空いっぱいの暗雲
        caption: 夕方になると、クイーンズタウンの空が雲に覆われてきた。翌日のスカイダイビングが心配になる。
        lat: -45.0301694
        lng: 168.6612861
      - src: https://blog-img.774352199.xyz/RDUhK2.webp
        alt: アジア系スーパー
        caption: アジア系というより、ほぼ中国のスーパー。火鍋の具材にスープの素、中国のお菓子、中国製のインスタント麺……何でもある。中国のゴールデンウィーク、今回はほぼ2週間の連休とあって、店内は中国人でいっぱい。火鍋用のカセットコンロは、レンタル分も販売分も出払っていた。火鍋の素と調味料、袋いっぱいのインスタント麺、それに螺蛳粉を一袋買った。螺蛳粉はタニシのだしを使う、独特な香りの米麺。
        lat: -45.0305889
        lng: 168.6609028
  - day: 7
    title: Shoot!
    shortTitle: Shoot!
    descriptions:
      - 朝6時の一番早いスカイダイビングを予約していたので、4時に起きて支度。5時半、出かけようとしたところで、天候による中止のメールが届いた。諦めきれず受付まで行ってみたけど、結局すごすごと帰るしかなかった。
      - ホテルに戻って昼まで休憩。スカイダイビングの中止を悲しむ間もなく、次にやって来たのは射撃！
    photos:
      - src: https://blog-img.774352199.xyz/FVyYbZ.webp
        mapZoomOffset: 0.6
        alt: 春の始まり
        lat: -45.0335361
        lng: 168.6660306
      - src: https://blog-img.774352199.xyz/JxgnfC.webp
        mapZoomOffset: 0.6
        alt: 吸い殻とお尻
        caption: 迎えを待っていると「Butts belong in this bin」と書かれたものがあった。buttsが「お尻」なのは知っているけど、文全体の意味が分からない。AIに聞いて初めて、ここでのbuttsはたばこの吸い殻だと知った 😂
        lat: -45.0307306
        lng: 168.6602639
      - src: https://blog-img.774352199.xyz/PrOvaU.webp
        mapZoomOffset: 0.6
        alt: 町の中心部
        lat: -45.0306972
        lng: 168.6603556
      - src: https://blog-img.774352199.xyz/Ijc2hK.webp
        mapZoomOffset: 0.6
        alt: 郊外を見渡す
        caption: 射撃場はクイーンズタウン郊外の山にある個人の牧場で、インストラクターは牧場主本人。羊を5千頭飼っていて、町外れのいくつもの丘が牧場なのだそう。イギリス植民地時代の名残なのか、地元の人は本当に天気の話が好きで、天気予報士をからかうのも好きらしい。
        lat: -45.0037639
        lng: 168.7099611
      - src: https://blog-img.774352199.xyz/BVINEB.webp
        mapZoomOffset: 0.6
        alt: ショットガン
        caption: 使うのはセミオートのショットガン。射撃位置の周りにはクレーの発射機がいくつもあり、インストラクターがリモコンを押すと標的が飛び出す。
        lat: -45.0058139
        lng: 168.7100528
      - src: https://blog-img.774352199.xyz/ro9M1H.webp
        mapZoomOffset: 0.6
        alt: まずは構えから
        caption: 始める前に、構え方と基本のコツを分かりやすく教わった。説明はほんの数言で終わり、何度も厳しく注意されることもない。レーザータグでも遊ぶのかと思うほどの気楽さで、少し現実感がなかった。繰り返し言われたのは「Eyes on target」、標的から目を離さないことだけ。
        lat: -45.0058528
        lng: 168.7100528
      - src: https://blog-img.774352199.xyz/Ng9QO6.webp
        mapZoomOffset: 0.6
        alt: 撃て！
        caption: 実際に持ってみると銃の重さが分かる。大きく振るのはちょっと大変。でも反動は意外と小さくて、火薬の量を減らしているのかなと思った。最後は一人40、50発ほど撃った。インストラクターはとにかく気分を上げてくれて、外してもこちらに都合のいい理由を見つけてくれる。
        live: https://blog-img.774352199.xyz/zlLxt9.mp4
        lat: -45.0058472
        lng: 168.7100361
      - src: https://blog-img.774352199.xyz/vEIRTD.webp
        mapZoomOffset: 0.6
        alt: かなりおすすめ
        caption: |-
          本当はワナカのReal Gunsへ行くつもりだったけど、交通の便が悪く、ちょうどいい時間も取れず、こちらに変更した。これがうれしい誤算で、体験は大満足。予約した時点では公式サイトにオンライン予約の入口はなく、メールか電話で問い合わせる形だった。
          公式サイト：https://breakone.co.nz
        lat: -45.0058444
        lng: 168.7100222
      - src: https://blog-img.774352199.xyz/RDgmbB.webp
        mapZoomOffset: 0.6
        alt: 有名なファーグバーガー
        caption: 帰りも町の中心部で降ろしてもらい、近くを少し散歩。小紅書でクイーンズタウンに来たら必食とされるファーグバーガーに出くわした。でも自分はまったく興味がなくて、早く帰って火鍋を食べたい。
        lat: -45.0317111
        lng: 168.6593639
      - src: https://blog-img.774352199.xyz/astXwO.webp
        mapZoomOffset: 0.6
        alt: ケンタとマック
        caption: なんとも平和な共存。
        lat: -45.0315694
        lng: 168.6614083
  - day: 7
    title: Skyline
    shortTitle: Skyline
    descriptions:
      - Skylineはクイーンズタウンの端の山にある。初めて町に入ったときから気になっていたけど、下から見上げるとぱっとしない。ゴンドラを通すために山肌が帯状に切り開かれ、岩がむき出しになっていて、むしろ少し不格好なくらいだった。
      - でも実際に展望台まで上がって、クイーンズタウンとワカティプ湖を見下ろすと、まるで別の景色だった。
      - ゴンドラ、リュージュ3回、山頂のビュッフェがセットになったチケットを買った。
    photos:
      - src: https://blog-img.774352199.xyz/mOqmRj.webp
        alt: ワカティプ湖
        caption: サマータイムのせいか、ニュージーランドは日が暮れるのがとても遅い。午後5時になっても夕暮れの気配がない。
        lat: -45.0331417
        lng: 168.6606611
      - src: https://blog-img.774352199.xyz/OkJTRk.webp
        alt: ゴンドラからの眺め その1
        lat: -45.02905
        lng: 168.6565389
      - src: https://blog-img.774352199.xyz/ZhHGPh.webp
        alt: ゴンドラからの眺め その2
        lat: -45.0275889
        lng: 168.652725
      - src: https://blog-img.774352199.xyz/W8duHW.webp
        alt: リュージュ
        caption: |-
          セットにはリュージュが3回分付いていた。あまり時間を取っていなかったので、最初は1回だけ乗って食事に行くつもりだった。ところが予想以上にスリル満点で、2回続けて滑ってもまだ物足りない。
          コースはArrowとDartの2本。説明ではArrowが穏やかで、Dartがスリル重視。でも実際に滑るとArrowも負けないくらい面白く、しかも距離が長いので、むしろこちらのほうがよかった。
        lat: -45.0257194
        lng: 168.6475361
      - src: https://blog-img.774352199.xyz/T1rVo8.webp
        alt: ビュッフェ
        caption: 料理はまずまず。冷たい飲み物とお酒は別料金で、含まれているのはコーヒーやお茶などの温かい飲み物だけ。初めて鹿肉を食べて、食べたことのある動物が一種増えた。特に変わった味はなく、食感も牛肉に近い。窓際の席からは、クイーンズタウンとワカティプ湖を一望できる。
        lat: -45.0264806
        lng: 168.6499028
      - src: https://blog-img.774352199.xyz/KN2GmZ.webp
        alt: 夕焼け
        caption: 山が夕焼けに染まり、その色が少しずつ消えるまで食事をしていた。店を出るころには真っ暗だったけど、リュージュはまだ営業中。もう一度リフトに乗って、最後の1回を滑った。
        lat: -45.0263639
        lng: 168.6498417
  - day: 8
    title: パラダイスのパラダイス・ロード
    shortTitle: パラダイスへ
    descriptions:
      - グレノーキーは南島の有名な小さな町で、『ロード・オブ・ザ・リング』や『ホビット』の中つ国のロケ地だという。クイーンズタウンから近く、車で30分ほど。
      - 地元の牧場でホーストレッキングを予約した。場所はパラダイスという地区のパラダイス・ロード。なんともぴったりの名前だ。
      - 前日のスカイダイビングが中止になったので、室内スカイダイビングも予約した。スカイダイビングというより、自由落下の感覚を味わうものに近い。
    photos:
      - src: https://blog-img.774352199.xyz/2DC2bu.webp
        alt: 世界で最も美しい道十選のひとつ
        caption: クイーンズタウンからグレノーキーまでは、ずっとワカティプ湖沿いを走る。湖には雪山が映り、薄い雲がかかる。この道は世界で最も美しい道十選のひとつともいわれている。
        lat: -45.0580778
        lng: 168.59105
      - src: https://blog-img.774352199.xyz/ETWnt7.webp
        alt: テイクオフ
        lat: -45.0580222
        lng: 168.5909111
      - src: https://blog-img.774352199.xyz/LHvGn8.webp
        alt: 鮮やかな赤
        lat: -44.8515389
        lng: 168.3825833
      - src: https://blog-img.774352199.xyz/9dWLdA.webp
        alt: 悪夢の赤い小屋
        caption: 以前ここへ来た同僚のCは、汲み取り式トイレでトラウマを負ったらしい。帰国後に聞かされた話のせいで、自分まで食欲の失せるような悪夢を見た。今日、ついにその実物を拝めた。
        lat: -44.8527028
        lng: 168.3834528
      - src: https://blog-img.774352199.xyz/UcaXyR.webp
        alt: 馬の水飲み場
        caption: 牧場に着くと、スタッフから乗馬の基本操作を簡単に教わった。乗馬経験のある自分には難しくない。相棒の名前はSmarty。群れでの立場が弱いらしく、説明では「low dominance」と言っていた。ときどきほかの馬にいじめられていて、ちょっとかわいそう。トレッキング中もずっと最後尾を歩くことになった。
        lat: -44.8006167
        lng: 168.3762194
      - src: https://blog-img.774352199.xyz/ldsntb.webp
        alt: さっそうと
        lat: -44.8011361
        lng: 168.3758389
      - src: https://blog-img.774352199.xyz/KsqoOC.webp
        alt: 道中 その1
        lat: -44.8038778
        lng: 168.3833167
      - src: https://blog-img.774352199.xyz/ukVks1.webp
        alt: 道中 その2
        caption: リース川を渡る。水は浅く、馬のひづめがやっと浸かるくらい。
        lat: -44.8026694
        lng: 168.3851611
      - src: https://blog-img.774352199.xyz/M9hPio.webp
        alt: 道中 その3
        lat: -44.8023417
        lng: 168.38585
      - src: https://blog-img.774352199.xyz/JN3G0K.webp
