        lat: -45.8683306
        lng: 170.50685
      - src: https://blog-img.774352199.xyz/flESS3.webp
        alt: 街並み その1
        caption: ヨーロッパの雰囲気たっぷりで、教会には事欠かない。写真のノックス教会は1872年に着工、1876年に完成した。
