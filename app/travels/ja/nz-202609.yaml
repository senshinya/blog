  - day: 9
    title: フィヨルドへ
    shortTitle: フィヨルドへ
    descriptions:
      - ニュージーランド西海岸のミルフォード・サウンドは、年間200日以上雨が降る、世界でも有数の雨の多い場所だ。ここで見たいのは終末感。水煙が立ちこめ、黒い雲が低く垂れこめ、岩壁から何百、何千もの滝が流れ落ちる景色。
      - ところが運がよすぎたのか、悪すぎたのか、年に何度もないような大晴天に当たってしまった。おかげで、こちらはこちらで珍しい絶景を見られた。
    photos:
      - src: https://blog-img.774352199.xyz/UGw319.webp
        alt: 風に揺れる草と牛や羊
        caption: ニュージーランドで見た牛や馬は、1万頭とはいかなくても数千頭はいるはず。そのどの一頭も、中国で「牛馬」と自嘲する働きづめの人間たちより、よほど楽に暮らしていた。
        lat: -45.4672083
        lng: 167.7928306
      - src: https://blog-img.774352199.xyz/Gxpgrf.webp
        alt: 山を縫う道
        caption: クイーンズタウンからフィヨルドへ行くには、サザンアルプスを越える。後半はほぼこんな山道で、谷の間を縫って走る。岩山が幾重にも重なり、空も日差しも隠してしまう。
        lat: -44.76015
        lng: 167.9690694
      - src: https://blog-img.774352199.xyz/MoeLJz.webp
        alt: ミルフォード・モナーク号
        caption: 大きなクルーズ船を、小さな遊覧艇みたいに撮ってしまった。大きな艦船を小さく見せる腕なら、中国軍の広報で役に立てるかもしれない。
        lat: -44.6685222
        lng: 167.9264667
      - src: https://blog-img.774352199.xyz/YlqWVM.webp
        alt: 岸沿い その1
        lat: -44.6669222
        lng: 167.9216472
      - src: https://blog-img.774352199.xyz/ELMRmv.webp
        alt: 岸沿い その2
        lat: -44.6647528
        lng: 167.9170222
      - src: https://blog-img.774352199.xyz/fmsqjy.webp
        alt: 岸沿い その3
        lat: -44.6636472
        lng: 167.9156333
      - src: https://blog-img.774352199.xyz/Pn4IeG.webp
        alt: 海への出口
        caption: 以前、フィヨルドは中国に唯一ない地形だという解説を見た。でも小紅書には、三峡とあまり変わらないという声も多い。フィヨルドは氷河が削った谷に海水が入ったもので、三峡は川が削ってできたもの。峡谷の部分だけ見れば、ミルフォードとそれほど違わないのかもしれない。
        lat: -44.604125
        lng: 167.8225111
      - src: https://blog-img.774352199.xyz/e8HNEN.webp
        alt: 岸沿い その4
        caption: 比べるものがあると、山の大きさがよく分かる。
        lat: -44.5997861
        lng: 167.8166194
      - src: https://blog-img.774352199.xyz/BMo7jf.webp
        alt: 岸沿い その5
        lat: -44.6101417
        lng: 167.8710944
      - src: https://blog-img.774352199.xyz/g4dKp6.webp
        alt: 船に便乗して岸へ
        lat: -44.6629528
        lng: 167.9186861
      - src: https://blog-img.774352199.xyz/1QwP4v.webp
        alt: テ・アナウの小さな町
        caption: 夜は湖畔の町、テ・アナウへ。商業的なにぎわいは少なく、人影もまばら。地元の人が少しいるほかは、フィヨルドを行き来する旅行者が泊まっているくらいで、とても静かだった。
        lat: -45.4220167
        lng: 167.7184139
      - src: https://blog-img.774352199.xyz/vXSfm0.webp
        alt: 時を越えて飛ぶ飛行機
        caption: テ・アナウ湖に水上飛行機が浮かんでいた。気になって機体番号ZK-DRHを調べると、なんと1974年にはすでにニュージーランドで飛んでいた。その年の12月、ピクトンのシェイクスピア湾に係留中、つむじ風で転覆して約4時間も水に浸かったらしい。その後引き揚げて修理され、今も現役で飛んでいる。
        lat: -45.4195861
        lng: 167.7139444
      - src: https://blog-img.774352199.xyz/9jRacX.webp
        alt: テ・アナウ湖
        lat: -45.4196083
        lng: 167.7136528
      - src: https://blog-img.774352199.xyz/KB2mC9.webp
        alt: ご当地名物
        caption: ニュージーランドに来たら買わずに帰れない、老舗のご当地名物。
        lat: -45.4224139
        lng: 167.7197111
  - day: 10
    title: 西海岸から東海岸へ
    shortTitle: 西海岸から東海岸
    descriptions:
      - ダニーデンは「南のエディンバラ」と呼ばれている。地名そのものが、スコットランド・ゲール語のエディンバラの呼び名に由来する。街全体にヨーロッパらしい雰囲気が漂っていた。
      - 夜はオアマルの町へ移動して、コガタペンギンが海から帰ってくるのを見た。撮影禁止なので、ほとんど写真を残せなかったのが残念。
