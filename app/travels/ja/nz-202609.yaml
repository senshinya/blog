        lat: -45.8739361
        lng: 170.5035389
      - src: https://blog-img.774352199.xyz/rF0iiI.webp
        alt: カモメに餌をあげる人
        caption: カモメにぐるりと囲まれ、カモも2羽混ざっていた。撮っているのに気づいたのか、こちらに手を振ってくれた。
