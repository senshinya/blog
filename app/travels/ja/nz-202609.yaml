  - day: 2
    title: クライストチャーチ
    shortTitle: クライストチャーチ
    descriptions:
      - 旅行会社は最初の一日を自由行動にしてくれていたので、クライストチャーチを気ままに歩ける。
      - 望むところ。朝はたっぷり寝た。
      - 午前中は散歩に出ようと思ったら、突然の暴風雨。風が強すぎて顔も上げられない。どうにか近くのスーパーまで歩いて食材を買い、DiDiでホテルに戻って昼食を作った。そう、中国の滴滴の海外版がちゃんと走っている。
      - 午後には晴れたので、改めて外へ。
