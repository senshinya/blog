  - day: 4
    title: アルパカと星空
    shortTitle: アルパカと星空
    descriptions:
      - アカロア郊外の丘にアルパカ牧場がある。スタッフの多くは台湾の人で、中国語で気兼ねなく話せた。
      - 一頭ずつ、名前や性格、気性、好きなものを熱心に教えてくれる。まるで自分の親友を紹介するようだった。
      - そのあとは車でテカポへ。アオラキ・マッケンジー国際ダークスカイ・リザーブの中にあり、生まれて初めて天の川を見た。
