slug: nz-202609
title: ニュージーランド南島
subtitle: '2026.9'
posttitle: 旅行記：ニュージーランド南島（2026年9月）
description: |-
  中秋節と国慶節の連休に合わせて、
  3日休みを取って13連休。
  二人で南半球へ向かった。
published: 2026-10-13
totaldays: 13
coverImage: https://blog-img.774352199.xyz/S69z5t.png
coverCaption: カイコウラの雪山と海
ending: それじゃあ、ここでお別れ。
days:
  - day: 1
    title: ひたすら移動
    shortTitle: 移動の日
    descriptions:
      - 数か月前は安い航空券を取れたとほくそ笑んでいたのに、いざ乗ってみたら笑えなかった。乗り継ぎがとにかく大変。上海から広州、広州からオークランド、最後にオークランドからクライストチャーチ。帰りはクライストチャーチからオークランド、オークランドから北京、北京から上海。最初の区間を飛び終えた時点でアップグレードの方法を調べ始めたけど、航空券の5倍もする追加料金を見て思いとどまった。
      - もともと神経が過敏なうえに、飛行機もちょっと怖い。騒音と揺れがあると、機内ではほぼ眠れない。運の悪いことに、行きも帰りもWi-Fiなし。結局、座席のモニターを見つめながら長い夜をやり過ごすしかなかった。
      - それでも、エアバスA350に初めて乗れたのはよかった。全体的な乗り心地は、帰りに乗ったボーイング787-9より快適だった。A350のモニターでは機体の外に付いた複数のカメラ映像をリアルタイムで見られて、離着陸のときはなかなか面白い。
      - 飛行機を降りてホテルにチェックインしたあとは、もうベッドに倒れ込みたかった。
