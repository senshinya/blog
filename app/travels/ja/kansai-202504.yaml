slug: kansai-202504
title: 近畿地方
subtitle: '2025.4'
posttitle: 旅行記：近畿地方（2025年4月）
description: |-
  4月のある週末、
  同僚が「日本に遊びに行こう」と言いました。
  というわけで、日本へ行ってきました。
published: 2025-05-19
totaldays: 3
coverImage: https://blog-img.774352199.xyz/X1lM9m.webp
days:
  - day: 0
    title: 浦東空港で眠れない夜
    descriptions:
      - 金曜の仕事が終わるなり高速鉄道で上海浦東空港へ向かいました。飛行機は土曜の朝6時です。こんな早朝便は初めてで勝手がわからず、空港からずいぶん遠いホテルを予約してしまいました。移動にかかる時間を考えると、もう空港で一晩しのいだほうがいいか、ということになりました。
      - 浦東空港で夜を明かすのがあれほどつらいと知っていたら、硬いベンチで朝まで座るくらいなら、ホテルで数時間だけでも横になっていたかったです。
      - 「すぐ眠れるように」とお酒を2本も持ってきましたが、結局は眠気が増しただけで、夜がさらに少しつらくなっただけでした。
    photos:
      - src: https://blog-img.774352199.xyz/YrOYzP.webp
        alt: 残業に励む
        caption: チェックインロビーで席を確保するだけでも一苦労で、コンセントのそばとなればなおさらです。閉店した飲食店のテーブルにまで人が横たわっていました。S君「金曜日でも、残業は頑張らないとね！」
        lat: 31.1535527
        lng: 121.80436
      - src: https://blog-img.774352199.xyz/6p1Ygk.webp
        alt: そっちが撮るなら、こっちも撮るよ！
        caption: K君は今回初めて、大がかりな撮影機材一式を旅行に持参しました。あちこち撮りまくっていて、妙にこそこそした雰囲気が漂っています。
        lat: 31.1507027
        lng: 121.80728
      - src: https://blog-img.774352199.xyz/oBCAWM.webp
        alt: 笑顔を取り繕いながら残業
        caption: もう午前4時です。チェックインも保安検査も税関も通過しました。これでS君も、ようやく誰にも邪魔されずに……残業できます。
        lat: 31.1506972
        lng: 121.8073194
      - src: https://blog-img.774352199.xyz/VWe7oM.webp
        alt: おしりピーチ航空
        caption: 日の出が近づくなか、前の便がようやく空港に到着しました。
        lat: 31.15072
        lng: 121.80741
      - src: https://blog-img.774352199.xyz/Haz3sP.webp
        alt: 翌朝の朝日
        caption: 待合エリアを何周も歩いていると、突然大勢の人が窓に張りついて写真を撮り始めました。ああ、日の出です。
        lat: 31.150605
        lng: 121.807594
      - src: https://blog-img.774352199.xyz/egvYLZ.webp
        alt: ちょっと不格好な緑の飛行機
        caption: ようやく搭乗券の確認を終えて機内へ入り、出発の準備ができました。窓の外では、ちょっと不格好なロシアの飛行機が着陸していました。
        lat: 31.15028
        lng: 121.808594
  - day: 1
    title: 雲の上
    descriptions:
      - 🛫 ——> 🛬
      - もう一度寝ようとしましたが、またも失敗。
      - もともと眠りが浅いので、エンジンの轟音や機体の振動があると眠れず、窓の外をぼんやり眺めるしかありません。S君とK君はぐっすりでした。若いっていいですね。頭を預けたらもう寝ています。
    photos:
      - src: https://blog-img.774352199.xyz/2s45dj.webp
        alt: 離陸です 🛫
        caption: こういう雲に覆われた日の離陸が大好きです。雲を突き抜けて、雲海の上へ出られるからです。
        lat: 31.15092
        lng: 121.809425
      - src: https://blog-img.774352199.xyz/FByyUH.webp
        alt: 雲の上。でもiCloudの「雲上貴州」ではありません
        lat: 30.9678027
        lng: 122.13342
      - src: https://blog-img.774352199.xyz/PhKuO2.webp
        alt: 雲の上、その2
        lat: 30.9699416
        lng: 122.14048
      - src: https://blog-img.774352199.xyz/8wSA4R.webp
        alt: 小さな島々
        caption: 退屈しきってずいぶん飛んだあと、ようやく最初の小さな島々が見えてきました。
        lat: 32.8994638
        lng: 129.580627
      - src: https://blog-img.774352199.xyz/HAAY0y.webp
        alt: 四国、その1
        caption: ようやく広い陸地が見えました。四国の上空です。
        lat: 34.1282
        lng: 134.566483
      - src: https://blog-img.774352199.xyz/gRislE.webp
        alt: 四国、その2
        caption: 日本は本当に起伏が多いです。山並みがどこまでも続き、まとまった平野は少ししかありません。都市も比較的小さく、小さな平野に3つも4つも収まっていたりします。中国なら、1つの都市とその管轄の区や県に相当する範囲でしょう。
        lat: 34.2280305
        lng: 134.875275
      - src: https://blog-img.774352199.xyz/FXbyzk.webp
        alt: 関西国際空港へ着陸
        caption: 関西国際空港は瀬戸内海の人工島にあります。天気はいまひとつで、少し灰色にかすんでいました。晴れた日なら海が見えます。
        lat: 34.43206
        lng: 135.24771
      - src: https://blog-img.774352199.xyz/axF4fX.webp
        alt: はるか
        caption: おなじみのハローキティはるかに乗りました。ただし、今回は京都へ向かいます。
        lat: 34.392638
        lng: 135.3321027
  - day: 1
    title: たぶん、起きてはいたのでしょう
    descriptions:
      - 日本のホテルには午後3時までチェックインできないという融通の利かない決まりがあるので、3人で京都をさまようことになりました。
      - 意識はもうありませんが、体だけはあちこち歩いています。
    photos:
      - src: https://blog-img.774352199.xyz/LaNbtP.webp
        alt: 行き当たりばったりの昼ごはん
        caption: 3人ともMBTIでいうP型で、レストランの予約なんてするはずもありません。京都駅の地下で、並ばずに入れる店を適当に選びました。結果、行列がないのには理由があるとわかりました。小さな半生の血がにじむステーキは、噛んでも噛んでも噛み切れず、そのうえやたら高かったです。
        lat: 34.9867972
        lng: 135.7580361
      - src: https://blog-img.774352199.xyz/GlHSXJ.webp
        alt: 繁華街の神社
        caption: ホテルは京都でもかなり近代的な四条の近くに取りました。そんな繁華街の大通り沿いにも、神社がいくつもあります。何々銀行、何々ビルと並んでいると、時代と空間が入り混じったような気分になります。
        lat: 35.00742
        lng: 135.7597194
      - src: https://blog-img.774352199.xyz/n9RrOE.webp
        alt: 因幡堂（平等寺）——「猫の神社」
        caption: ホテルに荷物を預けました。S君もK君も家にモフモフの家族がいるので、予定の最初は「猫の神社」とも呼ばれる因幡堂（平等寺）です。実際に祀られているのは薬師如来ですが、猫のお守りで有名です。小紅書では境内のキジトラに会えたという人もいました。残念ながら今回は会えず、仏像の後ろからずっと鳴き声が聞こえるだけでした。私は猫の形の手帳バンドを買いました。いつか好みの手帳に出会う日を楽しみにしています。
        lat: 34.9993416
        lng: 135.7602638
      - src: https://blog-img.774352199.xyz/KSjTQ6.webp
        alt: 道端の草むらに小さな⛩️
        lat: 34.9988805
        lng: 135.7680111
      - src: https://blog-img.774352199.xyz/z5nLnr.webp
        alt: 路地の奥に残る遅咲きの桜
        caption: 緑は豊かに、花の紅はまばらに。
        lat: 34.9988694
        lng: 135.7682333
      - src: https://blog-img.774352199.xyz/iPS74e.webp
        alt: 鴨川、その1
        caption: 鴨川には不思議な引力があります。ハルビンの松花江と同じで、あてもなく歩いていると、最後には必ずここへたどり着きます。
        lat: 34.9989
        lng: 135.7688
      - src: https://blog-img.774352199.xyz/N8ieWN.webp
        alt: 鴨川、その2
        caption: 鴨川のほとりに座って対岸をぼんやり見ていると、時間を飛び越えたような気がしました。少し寝て、また起きただけかもしれません。近くでは大学生らしきグループがピクニックをしていて、後ろを自転車やランニングの人が次々に通ります。何もかもがのんびりしていました。スマートフォンでまだ会議をしているS君を除いては。
        lat: 34.999005
        lng: 135.7695305
      - src: https://blog-img.774352199.xyz/d8cp3H.webp
        alt: ようやく熟睡
        caption: ようやく午後3時になり、ホテルに戻ってチェックインしました。S君はベッドに寝転がってスマートフォンを触っていましたが、画面が消える前に寝てしまいました。会議で疲れたのかもしれません。
        lat: 35.007616
        lng: 135.7597361
      - src: https://blog-img.774352199.xyz/bBuDpy.webp
        alt: 串焼き、最高！
        caption: 暗くなるまで寝てから、ごはんを探しに出かけ、居酒屋を見つけました。日本の人は食べる量がいつも少なくて、2人で焼き鳥を3、4本つまみ、あとはビールだけ飲んでいます。私たち3人はいきなり数十本を頼み、カクテルも3杯。お酒に弱いK君は即座に真っ赤になりました。
        lat: 35.0086
        lng: 135.7615305
  - day: 2
    title: 🦌の街・奈良——春日大社と東大寺
    descriptions:
      - 関西で遊びや体験を楽しむなら、奈良は外せません。自然と触れ合える場所です。
      - 街全体に、独特の自然の香りが漂っています。鹿のうんちの匂いです。
      - 今回は徹底してタダ乗りです。鹿せんべいは1袋も買わず、ただただなでさせてもらいます。
    photos:
      - src: https://blog-img.774352199.xyz/xvWtRr.webp
        alt: 近鉄奈良駅の外
        caption: さすが世界的な観光都市です。電車や地下鉄で奈良の観光広告をさんざん見かけましたが、実際の人出も京都や大阪よりずっと多かったです。
        lat: 34.684327
        lng: 135.829225
      - src: https://blog-img.774352199.xyz/Alg5Te.webp
        alt: Nikon——鳥を撮るなら、もっとくっきり
        lat: 34.685
        lng: 135.83248
      - src: https://blog-img.774352199.xyz/4WifFm.webp
        alt: 道端の🦌、その1
        caption: 奈良の道端には、こんなふうに脚を折りたたんで座る鹿がよくいます。お腹いっぱいなのかおとなしく、近づいてもせんべいをねだって追いかけてきません。何も買っていない後ろめたさがあって、私は頭を何度かそっとなでるだけにしました。
        lat: 34.68365
        lng: 135.838438
      - src: https://blog-img.774352199.xyz/7X1dwM.webp
        alt: 道端の🦌、その2
        caption: K君は遠慮なく、鹿の頭をぐいぐいとなで回していました。すると鹿の顔に、なんと笑みが。なるほど、ドMな鹿でしたか。
        lat: 34.68365
        lng: 135.838438
      - src: https://blog-img.774352199.xyz/ux8RMP.webp
        alt: 人気者の鹿
        caption: 春日大社の入口では、2基の灯籠の間に鹿が立っていることがよくあり、周りには写真を撮ったり餌をあげたりする人が大勢集まっています。この鹿もポーズを決めて、ご満悦でした。
        lat: 34.681061
        lng: 135.8444638
      - src: https://blog-img.774352199.xyz/1UgEGE.webp
        alt: おじぎする🦌
        caption: 神社の鹿は奈良公園の鹿よりずっと礼儀正しいです。しつこく追いかけたり、服の裾をかんだり、腰に頭突きしたりせず、頭を下げておじぎをしながら餌をねだります。
        lat: 34.68092
        lng: 135.8459472
      - src: https://blog-img.774352199.xyz/VpuSwQ.webp
        alt: 豊穣の玄鹿
        caption: うわ、スタレ民だ！
        lat: 34.6808805
        lng: 135.8466805
      - src: https://blog-img.774352199.xyz/18ZFvJ.webp
        alt: 吉！
        caption: 前回、清水寺で凶を引いたのをずっと引きずっていましたが、今回は春日大社でようやく吉が出ました。かわいそうに、S君は凶でした。
        lat: 34.681072
        lng: 135.8484194
      - src: https://blog-img.774352199.xyz/h6hz4h.webp
        alt: 人気者の鹿、その2
        caption: 清水寺の出口にもポーズを決めるのが好きな鹿がいましたが、入口に比べると人はまばらでした。
        lat: 34.6809694
        lng: 135.84764
      - src: https://blog-img.774352199.xyz/i66eZ6.webp
        alt: 東大寺
        caption: 東大寺は初めてではありませんが、それでも心から「本当に大きい」と感嘆しました。中国でも、ここまで巨大なお寺はなかなか見ません。
        lat: 34.6882361
        lng: 135.83935
      - src: https://blog-img.774352199.xyz/3HNlIx.webp
        alt: 広目天
        caption: 東大寺の広目天は、目を大きく見開いてにらんでいました。あれ、広目天って琵琶を使う人ではありませんでしたっけ。黒神話：悟空のやりすぎでしょうか。S君は東大寺でもう一度おみくじを引き、また凶。そこで手持ちの小銭を全部寄付していました。
        lat: 34.689083
        lng: 135.8396138
  - day: 2
    title: 若草山はうんちだらけ
    descriptions:
      - 東大寺を出て南東へ坂を上がると、若草山に着きます。
      - 小紅書でいう若草山は、実は西向きの小さな斜面だけです。あたり一面に鹿のうんちがあり、座れる場所がほとんどありません。聞こえてくるのも中国語ばかりで、中国にいるのと変わりませんでした。
      - そこで、あまりSNS映えスポット扱いされていない道を選ぶことにしました。本当の若草山の山頂まで登り、奈良の街全体を見渡します。
    photos:
      - src: https://blog-img.774352199.xyz/FM2yAW.jpg
        alt: 人気のない登山道
        caption: ひっそりした登山道で、人はほとんどいませんでした。
        lat: 34.6857083
        lng: 135.8504472
      - src: https://blog-img.774352199.xyz/OlFC10.jpg
        alt: 草を食べる🦌
        caption: 山の鹿はせんべいを求めて人を追いかけず、ただ静かに頭を下げて草を食べていました。正直、この鹿たちがいなければ、鹿はせんべい食ではなく草食動物だということを忘れるところでした。
        lat: 34.686175
        lng: 135.850314
      - src: https://blog-img.774352199.xyz/P9rOIJ.jpg
        alt: 中腹
        caption: 中腹には小さな平らな場所があり、意外にも何人かの観光客がいて、ここでキャンプするつもりのようでした。東は日差し、西は雨。まさに絶景です。
        lat: 34.6883
        lng: 135.8513027
      - src: https://blog-img.774352199.xyz/1uYlTL.webp
        alt: 恋愛ドラマのワンシーンみたい
        lat: 34.68828
        lng: 135.8513
      - src: https://blog-img.774352199.xyz/5K50g0.jpg
        alt: 登頂！
        caption: 力を振り絞って、ようやく山頂へ着きました。日はもう沈みかけていて、ちょうど地平線の雲に隠れていました。もう一度顔を出すのを期待してしばらく待ちましたが、太陽は雲の向こうに隠れたまま山の端へ沈んでしまいました。
        lat: 34.6900416
        lng: 135.853761
      - src: https://blog-img.774352199.xyz/UeUhOL.jpg
        alt: 人生の一枚
        caption: 下山中、K君が超望遠で私とS君を撮ってくれました。あの世界共通のハンドサインさえなければ、いろいろな意味で「人生の一枚」と呼べる写真でした。
        lat: 34.687957
        lng: 135.851129
      - src: https://blog-img.774352199.xyz/mpXAEK.jpg
        alt: 斜面いっぱいの🦌
        caption: 若草山のふもとでは、もう薄暗くなっていました。斜面いっぱいの鹿たちも追いかけっこをやめ、静かに頭を下げて草を食べていました。
        lat: 34.685311
        lng: 135.847342
      - src: https://blog-img.774352199.xyz/ZTYoPO.webp
        alt: 奈良のお米は高い
        caption: '日本へ来る前から、米の値段の高騰はニュースになっていました。コンビニでは1.5kgが1,920円。中国の1斤、つまり500gあたり30元以上で、驚くばかりです。'
        lat: 34.684598
        lng: 135.828862
  - day: 3
    title: そろそろ帰りましょう
    descriptions:
      - 最終日は特に予定がなかったので、買い物デーにしました。
      - 楽しい時間はあっという間です。帰ってほしくなかったのか、飛行機がわざわざ4時間も遅れてくれました。
    photos:
      - src: https://blog-img.774352199.xyz/PUlYJt.jpg
        alt: 高島屋近くのマック
        caption: 街なかのマックは名探偵コナンとコラボしていて、蘭の髪形みたいなバーガーまでありました。
        lat: 35.00373
        lng: 135.7675472
      - src: https://blog-img.774352199.xyz/GXtuL9.webp
        alt: Nintendo KYOTO
        caption: 高島屋で免税手続きをしていると、同じ階にNintendo KYOTOがありました。ソフトを買えば安いかも、と思って寄りましたが、置いてあったのはゲーム機とコントローラー、それに目を疑うほど高いフィギュアの山でした。
        lat: 35.00356
        lng: 135.7682194
      - src: https://blog-img.774352199.xyz/QDRn8G.jpg
        alt: 買い物代行もしてみました
        caption: 同僚のCに頼まれ、エディオンでPS5版のスプリット・フィクションを買いました。残念ながら、帰国してみると中国で買うのと別に変わりませんでした。
        lat: 35.003289
        lng: 135.769633
      - src: https://blog-img.774352199.xyz/3eYCtn.jpg
        alt: 買い物の成果
        caption: 'いくつもの商業施設を回って、何とか全部そろいました。免税分も入れると、京東で買うよりだいたい20〜30%安かったです。'
        lat: 35.005675
        lng: 135.759827
      - src: https://blog-img.774352199.xyz/grNniL.jpg
        alt: はるかに乗って空港へ
        lat: 34.985583
        lng: 135.756024
      - src: https://blog-img.774352199.xyz/BzWgH5.jpg
        alt: 車窓の風景
        caption: 空港へ向かったのは午後3時過ぎで、ちょうど日本の学校が終わる時間でした。窓に顔を寄せていると、下校中の女子高生や男子高生が、2人、3人と連れ立って歩いているのが見えます。青春ですね。若さと、その若さを味わう感覚は同時には持てないと言いますが、それでも人によっては、青春がひときわ青春らしいものなのだと思います。
        lat: 34.8889527
        lng: 135.670027
      - src: https://blog-img.774352199.xyz/tRRKQ1.jpg
        alt: 最後にもう一度、日本を眺めます
        lat: 34.4334416
        lng: 135.2434527
