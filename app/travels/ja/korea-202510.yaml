        lat: 35.160681
        lng: 129.163042
      - src: https://blog-img.774352199.xyz/7RIYv1.jpg
        alt: 夕食どきの焼肉店
        caption: 夜はにぎやかな焼肉店へ。ようやく、歩く以外のことをして時間を過ごせます。
        lat: 35.161944
        lng: 129.160383
      - src: https://blog-img.774352199.xyz/YiHMJH.jpg
        alt: 食器でいっぱいの焼肉のテーブル
        caption: 鉄板が温まりきる前に、小鉢、飲み物、食器でテーブルが埋まっていました。
        lat: 35.16185
        lng: 129.160244
      - src: https://blog-img.774352199.xyz/fgaWB7.jpg
        alt: 鉄板の上の肉
        caption: 肉をのせた後、この日に残された予定は、しっかり食べることだけでした。
        lat: 35.16185
        lng: 129.160244
  - day: 3
    title: ロープウェイから海を眺める
    descriptions:
      - 3日目は松島へ。昼食後に松島海上ロープウェイに乗ると、海面、山の斜面、街が足元でゆっくり動いていきます。あとは、ガラスの床をじっと見つめて怖くならないようにするだけです。
      - ロープウェイの中では距離感が不思議です。対岸は近く見えるのに、湾はいつまでも続きます。高層ビルが近づいてきて、ようやく松島の大半を横切ったことに気づきました。
    photos:
      - src: https://blog-img.774352199.xyz/TIi3un.jpg
        alt: ロープウェイに乗る前の熱いスープ
        caption: ロープウェイの前に、まずは熱いスープの鍋で昼食を済ませました。
        lat: 35.161683
        lng: 129.160558
      - src: https://blog-img.774352199.xyz/8ZSo2E.jpg
        alt: 松島のロープウェイと海岸
        caption: 駅を離れると、山の斜面、海、向かいの街が一度に広がりました。
        lat: 35.070572
        lng: 129.022419
      - src: https://blog-img.774352199.xyz/nysbC8.jpg
        alt: 向かいから来るロープウェイ
        caption: 別のゴンドラが岩場の前を滑るように通り、静かな海に少し動きが加わりました。
        lat: 35.070572
        lng: 129.022419
      - src: https://blog-img.774352199.xyz/fy4Cp5.jpg
        alt: ガラス張りの床の上の足
        caption: ガラスの下はすぐ海です。足は安全だと分かっていても、目はまだ信じ切れません。
        lat: 35.067303
        lng: 129.021761
      - src: https://blog-img.774352199.xyz/Eau0rl.jpg
        alt: 街へ向かうロープウェイのルート
        caption: 路線はまっすぐ街のスカイラインへ。行き先は見えても、距離はよく分かりません。
        lat: 35.062472
        lng: 129.020742
      - src: https://blog-img.774352199.xyz/NuI5Rl.jpg
        alt: 海の上を進むロープウェイ
        caption: 縦に一枚。ゴンドラが海からそのまま高層ビルの間へ上がっていくように見えました。
        lat: 35.062472
        lng: 129.020742
  - day: 3
    title: 松島の海辺の路地と遊歩道
    descriptions:
      - ロープウェイを降りて、海上の遊歩道へ。その後は観光名所を追いかけずに過ごしました。公園の猫、街灯のカラス、街角の彫刻を眺めながら、街へ戻っていきます。
      - 高いところからもう一度湾を眺めると、さっき乗ったロープウェイは細い線になっていました。夜はにぎやかな一角へ戻り、釜山での最後の丸一日をフライドチキンとビールで締めました。
    photos:
      - src: https://blog-img.774352199.xyz/pJ2oAE.JPG
        alt: 松島スカイウォーク
        caption: スカイウォークが海へ伸びています。前を歩く人のおかげで、その大きさが分かります。
      - src: https://blog-img.774352199.xyz/gFD7qT.jpg
        alt: 海辺の公園の猫
        caption: 公園の猫は観光客にあまり興味がない様子で、自分の場所を守りながら日なたぼっこしていました。
        lat: 35.061317
        lng: 129.020047
      - src: https://blog-img.774352199.xyz/VYvmUX.jpg
        alt: 街灯にとまるカラス
        caption: カラスが街灯にとまってしばらく眺めています。ここへよく来る、もう一人の常連のようです。
        lat: 35.061289
        lng: 129.019992
      - src: https://blog-img.774352199.xyz/G3KXz4.jpg
        alt: 街角の彫刻
        caption: 海辺を離れる途中で彫刻に出会いました。松島の公共空間には、ときどき思わぬ登場人物がいます。
        lat: 35.062411
        lng: 129.020389
      - src: https://blog-img.774352199.xyz/8gnZk4.jpg
        alt: 車窓から眺める釜山の街
        caption: 窓の外は海辺の公園から市街地へとつながり、道がだんだん混み合ってきました。
        lat: 35.087303
        lng: 129.024569
      - src: https://blog-img.774352199.xyz/WEtEqA.jpg
        alt: 松島のにぎやかな交差点
        caption: 商業地区に戻ると車と看板に囲まれ、さっきの潮風は後ろに遠ざかりました。
        lat: 35.097192
        lng: 129.029489
      - src: https://blog-img.774352199.xyz/vou4eu.JPG
