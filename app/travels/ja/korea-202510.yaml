        caption: さらに進むと、松林と寺院の屋根と海が、ようやく一つの画面に収まりました。
        lat: 35.188186
        lng: 129.223247
      - src: https://blog-img.774352199.xyz/Ooqc95.jpg
        alt: 寺院のそばの岩場
        caption: 寺から反対側を見ると、岩場が広い海に弧を描いていました。
        lat: 35.188592
        lng: 129.223344
      - src: https://blog-img.774352199.xyz/ZHo3qf.jpg
        alt: 岩の海岸と外海
        caption: 一番見晴らしのよいところまで来て、海東龍宮寺の散策も終わりです。
        lat: 35.188592
        lng: 129.223344
  - day: 2
    title: 機張の海と夕暮れ
    descriptions:
      - 寺を出て、そのまま海沿いを歩きました。観光地の風景はすぐに交差点や住宅街、海岸に沿って延びる線路へと変わります。海はずっと隣にありますが、角を曲がるたびに手前の景色が違います。
      - 夕方には日没に間に合い、線路と海、遠くの高層ビルがちょうど重なりました。海を十分に眺めてから街へ戻って焼肉を食べ、ようやく一日が終わりました。
    photos:
      - src: https://blog-img.774352199.xyz/c7yZCq.jpg
        alt: 機張の海岸沿いの街角
        caption: 観光地を離れて通りへ戻ると、海辺の街の普段の暮らしがまた目に入ってきました。
        lat: 35.166689
        lng: 129.183697
      - src: https://blog-img.774352199.xyz/qRCYuU.jpg
        alt: 昼間の海岸沿いの線路
        caption: 昼間の線路が海岸に沿って延びています。夕日を迎える場所を、先に取っておくようでした。
      - src: https://blog-img.774352199.xyz/DyQHqe.jpg
        alt: 海の夕焼け
        caption: 太陽がゆっくり沈んでいきます。海には人影もなく、余計なものもありません。
        lat: 35.155633
        lng: 129.177353
      - src: https://blog-img.774352199.xyz/Q8A3dI.jpg
        alt: 夕日、線路、遠くの高層ビル
        caption: 夕日がちょうど海沿いの線路の上に重なり、遠くのビルには最後の明るさが残っていました。
        lat: 35.155633
        lng: 129.177353
      - src: https://blog-img.774352199.xyz/ZoPRye.jpg
        alt: 住宅街を通る海沿いの線路
