        lng: 126.983583
  - day: 7
    title: 最後の半日と帰り道
    descriptions:
      - 最終日に残っていたのは半日だけ。大皿のグリルチキンを食べてから、ピョルマダン図書館へ行きました。商業施設の中の本の壁は、現実感が薄れるほどの高さです。静かに本を読む人より、間を通るエスカレーターに乗る人のほうが、この場所の日常らしく見えました。
      - 夕方に仁川空港へ向かい、夜の便で上海へ。翼の下に見慣れた街の明かりが戻ってきたころ、7日間もちょうど終わりです。どの日も、無理にもう一つ観光地を詰め込む必要はありませんでした。
