      - src: https://blog-img.774352199.xyz/THtGUu.jpg
        alt: 山林に点在する塔や施設
        caption: ズームすると、木々の中に散らばる塔や施設が少しずつ見えてきました。
        lat: 37.910942
        lng: 126.705883
      - src: https://blog-img.774352199.xyz/UlDxEN.jpg
        alt: DMZ入口の標識
        caption: DMZと書かれた入口は大げさではなく、一つの標識で場所は十分に伝わります。
        lat: 37.916419
        lng: 126.698369
      - src: https://blog-img.774352199.xyz/nmsnTK.jpg
        alt: 道端に展示された退役戦車
        caption: 使われなくなった戦車が道端に置かれていました。ここでは軍事の名残を、ただの背景としては見られません。
        lat: 37.916508
        lng: 126.698394
      - src: https://blog-img.774352199.xyz/5517dh.jpg
        alt: 人けのない道と車両阻止設備
        caption: 広い道が設備でいくつかに区切られ、いつもの曇り空までひときわ静かに感じられました。
        lat: 37.904286
        lng: 126.709119
      - src: https://blog-img.774352199.xyz/96FtP2.jpg
        alt: DMZからの帰りに見えた川と遠くの山々
        caption: 帰りは川と道路に沿って離れていきます。曇り空の下の遠い山々を見ながら、この見学を静かに終えました。
        lat: 37.905519
        lng: 126.740911
  - day: 5
    title: ソウルに戻った夜
    descriptions:
      - 夕方にソウルへ戻り、焼肉のテーブルを囲むにぎやかさで、ようやく昼間の気分が少し和らぎました。食後も街を歩き、アイス、服の露店、商業施設の明かりに囲まれるうち、また週末の人混みに戻っていました。
    photos:
      - src: https://blog-img.774352199.xyz/6dito9.jpg
        alt: ソウルへ戻って囲む焼肉のテーブル
        caption: 境界からソウルへ戻ると、夕食はまたにぎやかな焼肉の食卓になりました。
        lat: 37.553386
        lng: 126.920542
      - src: https://blog-img.774352199.xyz/3vNgox.jpg
        alt: 鉄板の上の夕食
        caption: 肉がジュージュー焼ける音を聞いて、昼間の重たい空気がようやく少しほどけました。
        lat: 37.553244
        lng: 126.920572
      - src: https://blog-img.774352199.xyz/KXNWVZ.jpg
        alt: 夜の街歩きで食べるアイス
        caption: 食後もそのまま散策。手に持ったアイスが、この時間の一番はっきりした目的でした。
        lat: 37.553061
        lng: 126.921106
      - src: https://blog-img.774352199.xyz/04H1g5.jpg
        alt: 道端の服の露店
        caption: 商業施設の外には歩道の端まで服の露店が並び、夜のほうがいっそう市場らしく見えます。
        lat: 37.554128
        lng: 126.922453
      - src: https://blog-img.774352199.xyz/nYpWaX.jpg
        alt: 夜のソウルの通り
        caption: 人と木と光る看板がひしめき、ソウルの週末の夜はまだまだ終わりません。
        lat: 37.555411
        lng: 126.923625
  - day: 6
    title: 宮殿と古い街を歩く
    descriptions:
      - この日も起きたのは遅めでした。まずチキンを食べ、それから景福宮へ。ずっと曇り空で、宮殿の塀の向こうの北岳山は半分ほど霧に隠れていました。そのぶん軒下の彩色が、晴れた日より鮮やかに見えます。
      - 宮門から光化門広場まで歩き、それから角を曲がって旧市街へ。伝統的な屋根と現代のオフィスビル、普通の通りがすぐ隣にあります。角を一つ曲がるだけで、別の時代へ移ったようでした。
    photos:
      - src: https://blog-img.774352199.xyz/U9hglv.jpg
        alt: 昼食のフライドチキン
        caption: 昼まで寝て、チキンで一日を始めました。栄養バランスはいったん置いておきます。
        lat: 37.555208
        lng: 126.921294
      - src: https://blog-img.774352199.xyz/JdCNnt.jpg
        alt: 景福宮の彩色された軒
        caption: 景福宮に入り、まず見上げたのは軒下の彩色です。曇り空よりずっと明るい色でした。
        lat: 37.576114
        lng: 126.972408
      - src: https://blog-img.774352199.xyz/LXCcDU.jpg
        alt: 霧の中の宮殿の塀と北岳山
        caption: 塀の後ろの山に霧がかかり、宮殿の背景に薄い層が一つ増えたようでした。
        lat: 37.576736
        lng: 126.975975
      - src: https://blog-img.774352199.xyz/pookDx.jpg
        alt: 屋根の棟にとまるカラス
        caption: 伝統的な屋根の上のカラス。黒い輪郭が、判子のようにすっきりしています。
        lat: 37.576756
        lng: 126.975883
      - src: https://blog-img.774352199.xyz/rfbX78.jpg
        alt: 伝統的な屋根と現代のオフィスビル
        caption: 宮殿の塀を挟んで、昔ながらの屋根とオフィスビルが一枚に収まります。ソウルでは珍しくない、時代の並び方です。
        lat: 37.576797
        lng: 126.975881
      - src: https://blog-img.774352199.xyz/gPUOFL.jpg
        alt: 宮門の前の韓服姿の観光客
        caption: 門に近づくほど韓服姿の人が増え、曇り空でも入口はにぎわっていました。
        lat: 37.576656
        lng: 126.976758
      - src: https://blog-img.774352199.xyz/cAiiwm.jpg
        alt: 景福宮の宮門
        caption: 正面から見ると端正なつくりで、余計な線がほとんど見当たりません。
        lat: 37.577494
        lng: 126.97695
      - src: https://blog-img.774352199.xyz/ew2Pax.jpg
        alt: 景福宮の正殿
        caption: ついに正殿が目の前に現れ、それまでの幾重もの門が前置きだったように感じました。
        lat: 37.577494
        lng: 126.97695
      - src: https://blog-img.774352199.xyz/9YWdSy.jpg
        alt: 光化門広場の世宗大王像
        caption: 景福宮を出て光化門広場へ。世宗大王像の前まで来ると、また現代のソウルへ戻った気分です。
        lat: 37.572814
        lng: 126.977025
      - src: https://blog-img.774352199.xyz/gyU2YG.jpg
        alt: 古い街の寺院の山門
        caption: 広場から曲がった先の山門は、思っていたよりずっと普段着の街区にありました。
        lat: 37.565183
        lng: 126.976914
      - src: https://blog-img.774352199.xyz/Mz9wvJ.jpg
        alt: 塀のそばの古木と屋根
        caption: 古木と屋根と塀が静かに寄り添い、観光客の声も少し遠くなりました。
        lat: 37.566008
        lng: 126.975583
      - src: https://blog-img.774352199.xyz/yanNBv.jpg
        alt: ソウルの古い市街地の通り
        caption: さらに進めば、もう普通の通りです。宮殿と古い街の間に、はっきりした境目はありません。
        lat: 37.563781
        lng: 126.977822
  - day: 6
    title: 南山から夜景へ
    descriptions:
      - 午後は南山へ向かいました。木々の間からNソウルタワーが見えたころには、もう日が暮れかけています。塔が緑に光ると、山頂からの眺めは一面の街の明かりになりました。
      - 山を下りて商店街へ戻ると、すぐにソウルのにぎやかさが戻ってきました。最後は熱いスープの鍋と蒸し卵。この旅で一番よく歩いた一日を、ゆっくり夕食をとって締めくくりました。
    photos:
      - src: https://blog-img.774352199.xyz/26ysHs.jpg
        alt: 南山へ向かう道の脇の記念碑
        caption: 午後は南山へ。道端の記念碑を過ぎ、ここから上り道が始まりました。
        lat: 37.557156
        lng: 126.983614
      - src: https://blog-img.774352199.xyz/yp95u3.jpg
        alt: 急斜面を上る軌道
        caption: ほとんどまっすぐ上へ延びる軌道。歩くより楽そうですが、想像以上に急です。
        lat: 37.556972
        lng: 126.983558
      - src: https://blog-img.774352199.xyz/WefO9m.jpg
        alt: 壁に描かれた昔のケーブルカー
        caption: 壁の古風なケーブルカーの絵が、この移動に少し昔の雰囲気を添えていました。
        lat: 37.556672
        lng: 126.984253
      - src: https://blog-img.774352199.xyz/IQEHwh.jpg
        alt: 木々の間に見えるNソウルタワー
        caption: 暗くなってから、まず葉の間に塔の一部が見えました。
        lat: 37.552
        lng: 126.987456
      - src: https://blog-img.774352199.xyz/mxUsp1.jpg
        alt: 緑にライトアップされたNソウルタワー
