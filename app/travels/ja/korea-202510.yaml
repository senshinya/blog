      - src: https://blog-img.774352199.xyz/EN4xux.jpg
        alt: 朝、窓の外に見えた海岸
        caption: カーテンを開けると、昨夜は音だけだった海に、ようやく色が付きました。
        lat: 35.160503
        lng: 129.160969
