        lat: 37.889997
        lng: 126.738881
      - src: https://blog-img.774352199.xyz/eQpG7l.jpg
        alt: 山際の伝統的なあずまや
        caption: あずまやには見学客が立ち寄り、ここはまだにぎやかでした。
        lat: 37.890053
        lng: 126.739864
      - src: https://blog-img.774352199.xyz/Ksw9Cq.jpg
