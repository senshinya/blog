        lat: 37.50975
        lng: 127.06005
      - src: https://blog-img.774352199.xyz/Ym9RBd.jpg
        alt: ピョルマダン図書館の本の壁とドーム状の天井
        caption: エスカレーター脇から見上げ、本の壁、丸みのある天井、行き交う人を一枚に収めました。
        lat: 37.50975
        lng: 127.06005
      - src: https://blog-img.774352199.xyz/FhPiR1.jpg
