title: 韓国
subtitle: '2025.10'
posttitle: 旅行記：韓国（2025年10月）
description: 釜山に降り立ち、海沿いを歩いてからソウルへ。7日間で海、寺院、境界線、宮殿、街の夜景を眺め、毎食しっかり味わいました。
published: 2026-08-17
totaldays: 7
coverImage: https://blog-img.774352199.xyz/rfbX78.jpg
days:
  - day: 1
    title: 釜山に到着、最初の夜は海辺で
    descriptions:
      - 金海に着陸したころには、一日の大半が過ぎていました。荷物を引いて地下鉄へ。韓国の第一印象はホームの静けさでしたが、街に入ると看板はどれもまぶしいくらいに光っていました。
      - 荷物を置いてから、やっぱり海へ行きました。夜の海雲台にはほとんど人がおらず、海岸沿いに高層ビルの明かりが並んでいます。短い初日でしたが、移動に追われる気分から抜け出すには十分でした。
    photos:
      - src: https://blog-img.774352199.xyz/DLNdZy.jpg
        alt: 金海空港に到着
        caption: 空港での最初の一枚。自分も荷物も着いたのに、頭はまだ移動中です。
        lat: 35.171903
        lng: 128.948506
      - src: https://blog-img.774352199.xyz/xoAPra.jpg
        alt: 釜山の地下鉄ホーム
        caption: 空港から街へ向かう最初の道のりは、静かな地下鉄のホームから始まりました。
        lat: 35.1634
        lng: 128.984025
      - src: https://blog-img.774352199.xyz/aDIuj7.jpg
        alt: 海辺の商店街
        caption: 宿の近くの通りは狭めですが、看板は1階から屋上まで光っています。
        lat: 35.163247
        lng: 129.158942
      - src: https://blog-img.774352199.xyz/Xe0RQq.jpg
        alt: 夜の店の看板
        caption: 向きを変えてもう一枚。夜の釜山は、さっきのホームよりずっとにぎやかでした。
        lat: 35.163011
        lng: 129.159344
      - src: https://blog-img.774352199.xyz/PKe4W6.jpg
        alt: 深夜の海雲台ビーチ
        caption: すっかり遅い時間になり、砂浜はかえって空いていました。遠くに明かりが一列に並ぶだけです。
        lat: 35.159397
        lng: 129.162444
      - src: https://blog-img.774352199.xyz/hUB6QE.jpg
        alt: 濡れた砂に寄せる波
        caption: 夜なので海の色は分かりませんが、濡れた砂へ寄せる波の白い縁ははっきり見えました。
        lat: 35.158586
        lng: 129.162442
      - src: https://blog-img.774352199.xyz/ZHJVJJ.jpg
        alt: 砂浜と海岸沿いの高層ビル
        caption: 振り返ると海沿いの高層ビルが見えます。ここでは街と海がほとんどくっついています。
        lat: 35.158806
        lng: 129.162481
  - day: 2
    title: 海沿いを歩く
    descriptions:
      - 目が覚めて、ようやく窓から海をはっきり見られました。昼食は牛肉と春雨の鍋、ビビンバ、それを囲む小鉢。今日の予定より食卓のほうがぎっしりです。
      - 午後は海東龍宮寺へ。岩場に沿って下へ広がる寺院で、石段、松林、屋根の合間から海が切れ切れに見えます。一番下まで行って、ようやく外海を広く見渡せました。
