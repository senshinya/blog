        lat: 35.160531
        lng: 129.160925
      - src: https://blog-img.774352199.xyz/gzf7XW.jpg
        alt: 鍋、ビビンバ、小鉢
        caption: 鍋とビビンバと小鉢でテーブルがいっぱいに。注文のチョイスは、ひとまず合格です。
        lat: 35.160719
        lng: 129.160567
