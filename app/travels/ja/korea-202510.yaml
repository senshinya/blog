        caption: 記念碑が風景の背後にある歴史を目の前に示し、空気も少し重くなりました。
        lat: 37.889764
        lng: 126.739586
      - src: https://blog-img.774352199.xyz/nAo1h6.jpg
        alt: 木々の向こうの吊り橋
