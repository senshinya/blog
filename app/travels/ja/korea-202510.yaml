        alt: フライドチキンとビール
        caption: 夜はチキンとビールで締めます。一日歩いた後なら、この量もちょうどよさそうです。
        lat: 35.161047
        lng: 129.16125
  - day: 4
    title: 北へ、街から街への移動日
    descriptions:
      - 朝、スマートフォンの「極めて深刻」という緊急警報で飛び起きました。よく読むと、秋夕の休暇中の救急医療についてのお知らせでした。韓国の人たちが休日を過ごす中、私たちは荷物を引いて次の街へ向かいます。
      - 釜山で昼食を済ませて北へ向かい、夕方にソウルへ到着しました。移動日なので観光の予定はありません。ホーム、熱い鍋、卵トーストだけでも、この一日は十分に語れます。
    photos:
      - src: https://blog-img.774352199.xyz/EHXTfN.jpg
        alt: 秋夕の休暇中の緊急通知
        caption: 朝、突然「極めて深刻」という警報が出ました。翻訳してようやく、秋夕期間の救急医療案内だと分かりました。
      - src: https://blog-img.774352199.xyz/2eGvwe.jpg
        alt: 釜山を出る前のビビンバ
        caption: 出発前にビビンバを一杯。移動日の予定より、こちらのほうがずっと彩り豊かです。
        lat: 35.115175
        lng: 129.039292
      - src: https://blog-img.774352199.xyz/zjiQKw.jpg
        alt: オムライスと付け合わせ
        caption: 同行者はオムライスを選びました。昼食の路線は違っても、お腹を満たす目的は同じです。
        lat: 35.115178
        lng: 129.039286
      - src: https://blog-img.774352199.xyz/t5zl3a.jpg
        alt: ソウル駅に到着
        caption: 数時間後にはソウルのホームに立っていました。釜山の海は、すっかり南に置いてきました。
        lat: 37.5534
        lng: 126.970911
      - src: https://blog-img.774352199.xyz/dSl7lk.jpg
        alt: ソウルで食べたプデチゲ
        caption: ソウルでの最初の食事は熱々のプデチゲ。麺を入れたばかりのところが撮りどきです。
        lat: 37.553531
        lng: 126.920636
      - src: https://blog-img.774352199.xyz/k19WnW.jpg
        alt: 卵トースト
        caption: 卵トーストも追加しました。移動日は運動量こそ少なくても、食欲には影響しません。
        lat: 37.553531
        lng: 126.920636
  - day: 5
    title: 境界線の南側で
    descriptions:
      - DMZへは決められたルートで向かいます。まず観光バスに乗り、記念碑、吊り橋、いくつかの展望地点をたどって少しずつ北へ。地図では境界は一本の線ですが、目の前にあるのは畑と街、曇り空の下の山々だけです。
      - ズームすると、山林の塔、道端の戦車、車両を止める設備が一つずつ見えてきました。ここの静けさは普通の郊外とは違います。帰りの川沿いの道でも、自然と口数が少なくなりました。
